<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../favicon.ico" type="image/x-icon">
<script src="../js/theme.js"></script>
<title>书 — 书架 — ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="../css/base.css" rel="stylesheet">
<style>
:root { --bc1: hsl(215 62% 72%); --bc2: hsl(249 55% 50%); }

/* ── ambient glow tinted by the book's cover hue ── */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i {
  position: absolute; border-radius: 50%;
  filter: blur(90px); opacity: .4;
  animation: drift 20s ease-in-out infinite alternate;
}
.aurora i:nth-child(1) {
  width: 42vw; height: 42vw; left: -10vw; top: -12vw;
  background: radial-gradient(circle, color-mix(in srgb, var(--bc1) 45%, transparent), transparent 70%);
}
.aurora i:nth-child(2) {
  width: 34vw; height: 34vw; right: -8vw; top: 22vh;
  background: radial-gradient(circle, color-mix(in srgb, var(--bc2) 32%, transparent), transparent 70%);
  animation-delay: -8s;
}
html[data-theme="dark"] .aurora i { opacity: .16; }
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(4vw, 3vh) scale(1.1); }
}

.cover-ambient { display: none; }

/* colored halo around the book, tinted by its own cover */
.cover-stage { position: relative; flex-shrink: 0; transition: transform .25s ease-out; }
.cover-glow {
  position: absolute; inset: -16%; z-index: -1;
  background: linear-gradient(155deg, var(--c1), var(--c2));
  background-size: cover; background-position: center;
  filter: blur(34px) saturate(1.5);
  opacity: .55;
  border-radius: 26px;
}
html[data-theme="dark"] .cover-glow { opacity: .38; }

/* hero info staggered entrance */
.detail-info > * { opacity: 0; animation: info-in .6s cubic-bezier(.2,.8,.2,1) forwards; }
.detail-info > *:nth-child(1) { animation-delay: .4s; }
.detail-info > *:nth-child(2) { animation-delay: .5s; }
.detail-info > *:nth-child(3) { animation-delay: .6s; }
.detail-info > *:nth-child(4) { animation-delay: .7s; }
.detail-info > *:nth-child(5) { animation-delay: .8s; }
@keyframes info-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .detail-info > * { animation: none; opacity: 1; }
}

.book-hero {
  position: relative;
  padding-top: 4.5rem;
  display: flex; gap: 2.4rem; align-items: flex-end;
  margin-bottom: 3.6rem;
}
.book-hero::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1.8rem; height: 1px;
  background: linear-gradient(90deg, transparent, var(--c1, var(--blue-l)), var(--c2, var(--blue-l)), transparent);
  opacity: .6;
}

.detail-cover {
  position: relative;
  width: 148px; aspect-ratio: 3/4.1; flex-shrink: 0;
  border-radius: 4px 10px 10px 4px;
  background: linear-gradient(155deg, var(--c1, #7aa2ff), var(--c2, #5470c8));
  box-shadow: 0 18px 36px -12px rgba(40, 60, 110, .45);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  opacity: 0;
  transform: perspective(900px) rotateY(-28deg) translateY(12px);
  animation: cover-in .8s cubic-bezier(.2,.8,.2,1) .15s forwards;
}
@keyframes cover-in { to { opacity: 1; transform: none; } }
.detail-cover::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 9px; z-index: 1;
  background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.14) 55%, rgba(0,0,0,.12));
}
.detail-cover::after {
  content: ''; position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(115deg, rgba(255,255,255,.22), transparent 42%);
}
.detail-cover span {
  writing-mode: vertical-rl;
  font-family: 'Noto Serif SC', serif;
  font-size: 19px; letter-spacing: .18em;
  color: rgba(255,255,255,.95);
  text-shadow: 0 1px 6px rgba(0,0,0,.3);
  max-height: 78%; overflow: hidden;
}
.detail-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.detail-info { min-width: 0; padding-bottom: .3rem; }
.detail-chips { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .9rem; }
.book-type {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--blue); background: var(--blue-ll);
  border: 1px solid var(--blue-l); border-radius: 99px;
  padding: 1px 8px;
}
.detail-eyebrow {
  font-size: 10px; letter-spacing: .24em; text-transform: uppercase;
  color: var(--ink2); font-weight: 500; font-family: 'Inter', sans-serif;
  margin-bottom: 1.1rem;
}
.detail-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 2.1rem; font-weight: 400; color: var(--ink);
  line-height: 1.35; margin-bottom: .55rem;
  background: linear-gradient(115deg, var(--ink) 30%, var(--blue) 105%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.name-row { display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; margin-bottom: .55rem; }
.name-row .detail-name { margin-bottom: 0; }
.read-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; flex-shrink: 0;
  color: var(--ink3);
  border-radius: 50%;
  transition: color .2s, background .2s, transform .2s;
}
.read-btn:hover { color: var(--blue); background: var(--blue-ll); transform: translateY(-1px); }
.read-btn svg { width: 16px; height: 16px; }
.detail-author { font-size: 13px; color: var(--ink2); margin-bottom: .8rem; }
.detail-rating { font-size: 12px; letter-spacing: .14em; color: var(--blue-l); }
.detail-rating .num { font-size: 11px; color: var(--ink3); margin-left: .5rem; letter-spacing: .03em; }
.detail-h {
  font-size: 11px; letter-spacing: .2em; color: var(--ink3);
  font-weight: 400; margin-bottom: .9rem;
  display: flex; align-items: center; gap: .8rem;
}
.page { counter-reset: sec; }
.detail-h::before {
  counter-increment: sec;
  content: '0' counter(sec);
  font-family: 'Inter', sans-serif;
  font-size: 10px; letter-spacing: .08em;
  color: var(--blue);
}
.detail-h::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.detail-desc { font-size: 13.5px; color: var(--ink2); line-height: 2.1; margin-bottom: 2.2rem; }
.detail-review { font-family: 'Noto Serif SC', serif; font-size: 14px; color: var(--ink2); line-height: 2.2; margin-bottom: 1.1rem; }
.detail-review:last-child { margin-bottom: 0; }
.detail-sec .detail-review:first-of-type::first-letter {
  float: left;
  font-size: 2.6em; line-height: 1;
  padding: .08em .12em 0 0;
  color: var(--blue);
}
.detail-sec { margin-bottom: 2.2rem; }

/* ── quotes ── */
.quote-list { display: flex; flex-direction: column; gap: 1rem; }
.quote {
  position: relative;
  margin: 0; padding: 1.05rem 1.4rem 1.05rem 2.7rem;
  background: var(--blue-ll);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px; color: var(--ink2); line-height: 2;
  transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s;
}
.quote:hover { transform: translateX(6px); border-color: var(--blue-l); box-shadow: var(--shadow-sm); }
.quote::before {
  content: '「';
  position: absolute; left: 1.05rem; top: .95rem;
  color: var(--blue); font-size: 17px;
}

/* ── quotes more / modal ── */
.quotes-more {
  margin-top: .5rem; align-self: center;
  font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: .12em;
  color: var(--ink3); background: transparent;
  border: 1px solid var(--line); border-radius: 10px;
  padding: .55rem 1.4rem; cursor: pointer;
  transition: color .2s, border-color .2s, transform .2s;
}
.quotes-more:hover { color: var(--blue); border-color: var(--blue-l); transform: translateY(-1px); }
.page > .quote-modal { animation: none; }
.quote-modal {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem;
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
.quote-modal.open { opacity: 1; pointer-events: auto; }
.quote-modal-mask {
  position: absolute; inset: 0;
  background: color-mix(in srgb, var(--ink) 22%, transparent);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.quote-modal-card {
  position: relative; width: 100%; max-width: 620px; max-height: 78vh;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 1.6rem 1.7rem;
  box-shadow: 0 24px 64px rgba(0,0,0,.18);
  transform: translateY(14px);
  transition: transform .25s cubic-bezier(.2,.8,.2,1);
}
.quote-modal.open .quote-modal-card { transform: none; }
.quote-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.2rem;
}
.quote-modal-head .detail-h { margin-bottom: 0; }
.quote-modal-count { font-size: 11px; color: var(--ink4); letter-spacing: .1em; margin-left: .7rem; }
.quote-modal-close {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  border: 1px solid var(--line); background: transparent;
  color: var(--ink3); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color .2s, border-color .2s, transform .2s;
}
.quote-modal-close:hover { color: var(--blue); border-color: var(--blue-l); transform: rotate(90deg); }

/* ── markdown notes ── */
.md-body { font-size: 13.5px; color: var(--ink2); line-height: 2; }
.md-body h2, .md-body h3, .md-body h4 {
  font-family: 'Noto Serif SC', serif; font-weight: 400; color: var(--ink);
  margin: 2.2rem 0 .9rem; line-height: 1.5;
}
.md-body h2 { font-size: 1.15rem; }
.md-body h3 { font-size: 1.05rem; }
.md-body h4 { font-size: .95rem; }
.md-body > *:first-child { margin-top: 0; }
.md-body p { margin-bottom: 1rem; }
.md-body ul, .md-body ol { padding-left: 1.4rem; margin-bottom: 1rem; }
.md-body li { margin-bottom: .4rem; }
.md-body blockquote {
  margin: 0 0 1rem; padding: .15rem 1rem;
  border-left: 2px solid var(--blue-l);
  color: var(--ink3);
}
.md-body code {
  font-family: Consolas, monospace; font-size: .9em;
  background: var(--blue-ll); padding: .1em .45em; border-radius: 4px;
}
.md-body pre {
  background: var(--blue-ll); border: 1px solid var(--line); border-radius: 10px;
  padding: 1rem; overflow-x: auto; margin-bottom: 1rem;
}
.md-body pre code { background: none; padding: 0; }
.md-body pre.mermaid {
  background: transparent; border: none; padding: 1rem 0;
  display: flex; justify-content: center;
}
/* ── collapsible notes ── */
.notes-fold {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  padding: 1.15rem 1.35rem;
  transition: border-color .25s, box-shadow .25s;
}
.notes-fold:hover { border-color: var(--blue-l); box-shadow: var(--shadow-sm); }
.notes-fold[open] { border-color: var(--blue-l); }
.notes-fold summary {
  display: flex; align-items: center; gap: .9rem;
  cursor: pointer; list-style: none; user-select: none;
}
.notes-fold summary::-webkit-details-marker { display: none; }
.notes-fold summary .detail-h { flex: 1; margin-bottom: 0; transition: color .2s; }
.notes-fold summary:hover .detail-h { color: var(--ink2); }
.fold-hint { font-size: 10px; letter-spacing: .15em; color: var(--ink4); flex-shrink: 0; }
.notes-fold[open] .fold-hint { display: none; }
.fold-chevron {
  width: 14px; height: 14px; flex-shrink: 0;
  stroke: var(--ink4); fill: none; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
  transition: transform .25s cubic-bezier(.2,.8,.2,1), stroke .2s;
}
.notes-fold[open] .fold-chevron { transform: rotate(90deg); stroke: var(--blue); }
.notes-fold .md-body { padding-top: 1.3rem; }
.notes-fold[open] .md-body { border-top: 1px solid var(--line); margin-top: 1.1rem; }

.md-body hr { border: none; border-top: 1px solid var(--line); margin: 2rem 0; }

/* ── timeline block (```timeline) ── */
.tl { position: relative; margin: .6rem 0 1.5rem; padding-left: 1.4rem; }
.tl::before {
  content: ''; position: absolute; left: 5px; top: 10px; bottom: 10px; width: 1px;
  background: linear-gradient(var(--blue-l), var(--line));
}
.tl-item {
  position: relative;
  padding: .5rem 0 .5rem 1rem;
  opacity: 0;
  animation: tl-in .5s cubic-bezier(.2,.8,.2,1) forwards;
  animation-delay: calc(var(--i, 0) * .07s + .1s);
}
@keyframes tl-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.tl-item::before {
  content: ''; position: absolute; left: calc(-1.4rem - 1px); top: 1.05rem;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--blue);
  transition: transform .2s, box-shadow .2s;
}
.tl-item:hover::before { transform: scale(1.35); box-shadow: 0 0 0 4px var(--blue-ll); }
.tl-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 14px; color: var(--ink); line-height: 1.5;
  transition: color .2s;
}
.tl-item:hover .tl-title { color: var(--blue); }
.tl-sub { font-size: 12px; color: var(--ink3); line-height: 1.6; margin-top: .1rem; }
.md-body a { color: var(--blue); text-decoration: none; }
.md-body img { max-width: 100%; border-radius: 10px; }
.md-body table {
  width: 100%; border-collapse: collapse;
  margin-bottom: 1.5rem; font-size: 12.5px;
}
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 1.5rem; }
.table-wrap .md-body table, .table-wrap table { margin-bottom: 0; }
.md-body th, .md-body td {
  padding: .55rem .7rem; text-align: left; vertical-align: top;
  border-bottom: 1px solid var(--line); line-height: 1.7;
}
.md-body th {
  font-size: 10px; letter-spacing: .12em; color: var(--ink4); font-weight: 400;
  border-bottom: 1px solid var(--blue-l);
  white-space: nowrap;
}
.md-body td:first-child { white-space: nowrap; color: var(--blue); }
.md-body td:nth-child(2) { white-space: nowrap; color: var(--ink4); }
.md-body tbody tr { transition: background .2s; }
.md-body tbody tr:hover { background: var(--blue-ll); }

.not-found { padding: 6rem 0; text-align: center; }
.not-found p { font-size: 13px; color: var(--ink4); margin-bottom: 1.5rem; }
.not-found a { font-size: 12px; color: var(--blue); text-decoration: none; }
footer { margin-top: 6rem; }
@media (max-width: 600px) {
  .book-hero { flex-direction: column; align-items: flex-start; gap: 1.6rem; padding-top: 3rem; }
  .detail-info { width: 100%; }
  .detail-cover { width: 108px; }
  .detail-cover span { font-size: 15px; }
  .detail-name { font-size: 1.45rem; }
  .detail-eyebrow { letter-spacing: .18em; }
  .quote { padding: .9rem 1.1rem .9rem 2.3rem; }
  .quote::before { left: .85rem; top: .78rem; font-size: 15px; }
  .notes-fold { padding: 1rem 1.05rem; }
  .notes-fold .md-body { padding-top: 1rem; }
  .md-body table { min-width: 540px; }
  .md-body th, .md-body td { padding: .5rem .55rem; }
  .tl { padding-left: 1.15rem; }
  .tl-item { padding-left: .85rem; }
}
@media (prefers-reduced-motion: reduce) {
  .aurora i { animation: none; }
}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i></div>

<nav>
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo"><span class="nav-dot"></span><span class="nav-name">ling</span></a>
    <a href="../bookshelf.html" class="nav-back">← 书架</a>
    <button class="theme-switch" type="button" onclick="toggleTheme()" aria-label="切换主题">
      <span class="switch-track">
        <span class="switch-thumb">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
      </span>
    </button>
  </div>
</nav>

<div class="page" id="page"></div>

<script>
const page = document.getElementById('page');
const FOOTER = `
  <footer>
    <p>© 2026 ling</p>
    <p>Reading · Archive</p>
    <p class="busuanzi-count"><span id="busuanzi_container_site_pv" style="display:none">访问 <span id="busuanzi_value_site_pv"></span> 次</span><span id="busuanzi_container_site_uv" style="display:none"> · 访客 <span id="busuanzi_value_site_uv"></span> 人</span></p>
  </footer>`;
function hueFrom(str) {
  let h = 0;
  for (const c of String(str)) h = (h * 31 + c.codePointAt(0)) % 360;
  return h;
}
function render(b) {
  document.title = `${b.name} — 书架 — ling`;
  const hue = hueFrom(b.name || '书');
  const c1 = `hsl(${hue} 62% 72%)`, c2 = `hsl(${(hue + 34) % 360} 55% 50%)`;
  document.documentElement.style.setProperty('--bc1', c1);
  document.documentElement.style.setProperty('--bc2', c2);
  const cover = b.cover
    ? `<img src="${b.cover}" alt="${b.name}">`
    : `<span>${b.name || ''}</span>`;
  const full = b.rating != null ? Math.max(0, Math.min(5, Math.round(b.rating))) : 0;
  page.innerHTML = `
    <div class="book-hero" style="--c1:${c1};--c2:${c2}">
      <div class="cover-stage" id="cover-stage">
        <div class="cover-glow"${b.cover ? ` style="background-image:url(&quot;${b.cover}&quot;)"` : ''}></div>
        <div class="detail-cover">${cover}</div>
      </div>
      <div class="detail-info">
        <p class="detail-eyebrow">Bookshelf · 藏书</p>
        <div class="detail-chips">
          <span class="book-type">${b.type || '其他'}</span>
        </div>
        <div class="name-row">
          <h1 class="detail-name">${b.name || '未命名'}</h1>
          ${b.link ? `<a class="read-btn" href="${b.link}" target="_blank" rel="noopener" title="在线阅读" aria-label="在线阅读"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg></a>` : ''}
        </div>
        <p class="detail-author">${b.author || ''}</p>
        ${b.rating != null ? `<div class="detail-rating">${'★'.repeat(full)}${'☆'.repeat(5 - full)}<span class="num">${b.rating} / 5</span></div>` : ''}
      </div>
    </div>
    <div class="detail-sec">
      <h2 class="detail-h">简介</h2>
      <p class="detail-desc">${b.desc || ''}</p>
    </div>
    ${b.review ? `
    <div class="detail-sec">
      <h2 class="detail-h">短评</h2>
      ${String(b.review).split(/\n+/).filter(p => p.trim()).map(p => `<p class="detail-review">${esc(p)}</p>`).join('')}
    </div>` : ''}
    ${b.quotes && b.quotes.length ? `
    <div class="detail-sec">
      <h2 class="detail-h">书摘</h2>
      <div class="quote-list">
        ${b.quotes.slice(0, 5).map(q => `<blockquote class="quote"><p>${esc(q)}</p></blockquote>`).join('')}
        ${b.quotes.length > 5 ? `<button class="quotes-more" id="quotes-more" type="button">查看全部书摘 · ${b.quotes.length} 条</button>` : ''}
      </div>
    </div>
    ${b.quotes.length > 5 ? `
    <div class="quote-modal" id="quote-modal" aria-hidden="true">
      <div class="quote-modal-mask" data-close></div>
      <div class="quote-modal-card" role="dialog" aria-label="全部书摘">
        <div class="quote-modal-head">
          <h2 class="detail-h">书摘<span class="quote-modal-count">共 ${b.quotes.length} 条</span></h2>
          <button class="quote-modal-close" type="button" data-close aria-label="关闭">✕</button>
        </div>
        <div class="quote-list">
          ${b.quotes.map(q => `<blockquote class="quote"><p>${esc(q)}</p></blockquote>`).join('')}
        </div>
      </div>
    </div>` : ''}` : ''}
    ${b.notes ? `
    <details class="detail-sec notes-fold" id="notes-fold">
      <summary>
        <h2 class="detail-h">笔记</h2>
        <span class="fold-hint">展开</span>
        <svg class="fold-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </summary>
      <div class="md-body" id="md-body"><p style="color:var(--ink4);font-size:12px">笔记加载中…</p></div>
    </details>` : ''}
    ${FOOTER}
  `;
  const fold = document.getElementById('notes-fold');
  if (fold) {
    let notesMounted = false;
    fold.addEventListener('toggle', () => {
      if (fold.open && !notesMounted) { notesMounted = true; mountNotes(b); }
    });
  }
  const qm = document.getElementById('quote-modal');
  if (qm) {
    const closeQm = () => { qm.classList.remove('open'); document.body.style.overflow = ''; };
    document.getElementById('quotes-more').addEventListener('click', () => {
      qm.classList.add('open');
      document.body.style.overflow = 'hidden';
    });
    qm.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', closeQm));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeQm(); });
  }
  mountTilt();
}
function mountTilt() {
  const stage = document.getElementById('cover-stage');
  if (!stage) return;
  if (!window.matchMedia('(pointer: fine)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  stage.addEventListener('mousemove', e => {
    const r = stage.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    stage.style.transform = `perspective(900px) rotateY(${(x * 14).toFixed(2)}deg) rotateX(${(-y * 10).toFixed(2)}deg)`;
  });
  stage.addEventListener('mouseleave', () => { stage.style.transform = ''; });
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function mountNotes(b) {
  if (!b.notes) return;
  loadScript('https://cdn.jsdelivr.net/npm/marked@12/marked.min.js').then(() => {
    const renderer = new marked.Renderer();
    renderer.code = function (code, lang) {
      if (code && typeof code === 'object') { lang = code.lang; code = code.text; }
      if (lang === 'mermaid') return `<pre class="mermaid">${esc(code)}</pre>`;
      if (lang === 'timeline') {
        const items = String(code).trim().split('\n').filter(l => l.trim()).map((line, i) => {
          const parts = line.split('|').map(x => x && x.trim());
          return `<div class="tl-item" style="--i:${i}"><div class="tl-title">${esc(parts[0] || '')}</div>${parts[1] ? `<div class="tl-sub">${esc(parts[1])}</div>` : ''}</div>`;
        }).join('');
        return `<div class="tl">${items}</div>`;
      }
      return `<pre><code>${esc(code)}</code></pre>`;
    };
    document.getElementById('md-body').innerHTML = marked.parse(b.notes, { renderer });
    document.querySelectorAll('#md-body table').forEach(t => {
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
    const diagrams = document.querySelectorAll('.mermaid');
    if (!diagrams.length) return;
    loadScript('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js').then(() => {
      mermaid.initialize({
        startOnLoad: false,
        theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'neutral'
      });
      mermaid.run({ nodes: diagrams });
    });
  }).catch(() => {
    const el = document.getElementById('md-body');
    if (el) el.innerHTML = '<p style="color:var(--ink4);font-size:12px">笔记加载失败</p>';
  });
}
function renderMissing() {
  document.title = '没有找到这本书 — ling';
  page.innerHTML = `
    <div class="not-found">
      <p>没有找到这本书，它可能还没被放上书架。</p>
      <a href="../bookshelf.html">← 回到书架</a>
    </div>
    ${FOOTER}
  `;
}
const id = new URLSearchParams(location.search).get('id');
Promise.all([
  fetch('index.json').then(r => r.json()),
  id ? fetch(`${encodeURIComponent(id)}.json`).then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null)
])
  .then(([books, detail]) => {
    const base = (books || []).find(x => x.id === id) || (!id && books && books[0]);
    const b = base ? Object.assign({}, base, detail) : detail;
    if (b) render(b); else renderMissing();
  })
  .catch(renderMissing);
</script>
