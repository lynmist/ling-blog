<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<script src="js/theme.js"></script>
<title>页面不存在 — ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="css/base.css" rel="stylesheet">
<style>
.error-page {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding-top: 4rem;
}
.error-code {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(5rem, 18vw, 10rem);
  font-weight: 300;
  color: var(--blue-l);
  line-height: 1;
  margin-bottom: 1.5rem;
}
.error-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.5rem;
  font-weight: 300;
  color: var(--ink);
  margin-bottom: 1rem;
}
.error-desc {
  font-size: 14px;
  color: var(--ink2);
  line-height: 1.8;
  margin-bottom: 2.5rem;
}
.error-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--blue);
  text-decoration: none;
  padding: 8px 20px;
  background: var(--blue-ll);
  border: 1px solid var(--blue-l);
  border-radius: 99px;
  transition: background .15s;
}
.error-back:hover { background: var(--hover); }
footer { margin-top: 4rem; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><span class="nav-dot"></span><span class="nav-name">ling</span></a>
    <a href="index.html" class="nav-back">← Back</a>
    <button class="theme-switch" type="button" onclick="toggleTheme()" aria-label="切换主题">
      <span class="switch-track">
        <span class="switch-thumb">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
      </span>
    </button>
  </div>
</nav>

<div class="page">
  <div class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title">这里什么都没有</h1>
    <p class="error-desc">你要找的页面可能已经搬走，或者从未存在过。</p>
    <a href="index.html" class="error-back">← 返回首页</a>
  </div>

  <footer>
    <p>© 2026 ling</p>
    <p>Gallery · Writing · Archive</p>
  </footer>
</div>

</body>
</html>
