<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<script src="js/theme.js"></script>
<title>实验 — ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="css/base.css" rel="stylesheet">
<style>
.labs-intro { padding-top: 3rem; font-size: 14px; color: var(--ink2); line-height: 2; max-width: 520px; }
.labs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; padding-top: 3rem; }
.lab-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 0.6rem;
  padding: 1.6rem 1.4rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm);
  transition: transform .2s, box-shadow .2s, border-color .2s, background .25s;
}
.lab-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--blue-l); }
.lab-icon {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--blue-ll);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  color: var(--blue);
  font-size: 18px;
}
.lab-name { font-size: 15px; font-weight: 500; color: var(--ink); }
.lab-desc { font-size: 12px; color: var(--ink2); line-height: 1.6; }
.lab-count { font-size: 10px; letter-spacing: 0.14em; color: var(--ink4); margin-top: 2px; }
button.lab-card { font: inherit; text-align: left; cursor: pointer; width: 100%; }

/* ── group modal ── */
.lab-modal-bg {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(28,43,56,0.45);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem;
  visibility: hidden; opacity: 0;
  transition: opacity .25s ease, visibility .25s;
}
.lab-modal-bg.open { visibility: visible; opacity: 1; }
.lab-modal {
  width: 440px; max-width: 100%;
  max-height: 80vh; overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-md);
  padding: 1.4rem;
  transform: translateY(14px) scale(0.97); opacity: 0;
  transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .22s ease;
}
.lab-modal-bg.open .lab-modal { transform: none; opacity: 1; }
.lab-modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.lab-modal-title { font-size: 13px; font-weight: 500; letter-spacing: 0.1em; color: var(--ink); }
.lab-modal-close { background: none; border: none; font-size: 14px; color: var(--ink3); cursor: pointer; padding: 4px; line-height: 1; }
.lab-modal-close:hover { color: var(--ink); }
.lab-modal-item {
  display: flex; align-items: center; gap: 1rem;
  padding: 0.9rem 1rem; margin-bottom: 0.6rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  text-decoration: none; color: inherit;
  transition: background .15s, border-color .15s;
}
.lab-modal-item:last-child { margin-bottom: 0; }
.lab-modal-item:hover { background: var(--blue-ll); border-color: var(--blue-l); }
.lab-modal-item .lab-icon { width: 34px; height: 34px; border-radius: 9px; font-size: 14px; flex-shrink: 0; }
.lab-modal-item .lab-name { font-size: 14px; }
.lab-modal-item .lab-desc { font-size: 11px; }

/* stagger items in when the modal opens */
.lab-modal-bg.open .lab-modal-item { animation: lab-item-in .3s cubic-bezier(.2,.8,.2,1) both; }
.lab-modal-bg.open .lab-modal-item:nth-child(2) { animation-delay: .05s; }
.lab-modal-bg.open .lab-modal-item:nth-child(3) { animation-delay: .1s; }
.lab-modal-bg.open .lab-modal-item:nth-child(4) { animation-delay: .15s; }
.lab-modal-bg.open .lab-modal-item:nth-child(5) { animation-delay: .2s; }
.lab-modal-bg.open .lab-modal-item:nth-child(n+6) { animation-delay: .25s; }
@keyframes lab-item-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .lab-modal-bg, .lab-modal { transition: none; }
  .lab-modal-bg.open .lab-modal-item { animation: none; }
}
footer { margin-top: 6rem; }
@media (max-width: 600px) {
  .labs-grid { grid-template-columns: 1fr; }
  .lab-card { flex-direction: row; align-items: center; gap: 1rem; padding: 1.2rem; }
  .lab-text { flex: 1; min-width: 0; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><span class="nav-dot"></span><span class="nav-name">ling</span></a>
    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="writing.html">Writing</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="more.html">More</a></li>
    </ul>
    <button class="theme-switch" type="button" onclick="toggleTheme()" aria-label="切换主题">
      <span class="switch-track">
        <span class="switch-thumb">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
      </span>
    </button>
  </div>
</nav>

<div class="page">
  <header class="page-header">
    <p class="page-eyebrow">Labs</p>
    <h1 class="page-title">实验</h1>
    <p class="page-sub">一些小工具、预览站点和其他想单独放出来的东西。</p>
  </header>

  <p class="labs-intro">每个卡片都是一个独立的小页面，放在 labs/ 下的单独文件夹里，随时可以增加或替换。</p>

  <div class="labs-grid" id="labs-grid"></div>

  <footer>
    <p>© 2026 ling</p>
    <p>Labs · Archive</p>
  </footer>
</div>

<!-- Group picker modal -->
<div class="lab-modal-bg" id="lab-modal">
  <div class="lab-modal" role="dialog" aria-modal="true">
    <div class="lab-modal-head">
      <span class="lab-modal-title" id="lab-modal-title"></span>
      <button class="lab-modal-close" id="lab-modal-close" aria-label="关闭">✕</button>
    </div>
    <div id="lab-modal-list"></div>
  </div>
</div>

<script>
fetch('labs/index.json')
  .then(r => r.json())
  .then(labs => {
    const grid = document.getElementById('labs-grid');
    if (!labs || labs.length === 0) {
      grid.innerHTML = '<div class="empty"><p>还没有实验项目</p></div>';
      return;
    }

    // an entry with a `children` array renders as a group button; everything else is a plain link card
    grid.innerHTML = labs.map((l, i) => {
      if (l.children && l.children.length) {
        return `
      <button type="button" class="lab-card" data-group="${i}">
        <div class="lab-icon">${l.icon || '◆'}</div>
        <div class="lab-text">
          <div class="lab-name">${l.name || '未命名'}</div>
          <div class="lab-desc">${l.desc || ''}</div>
          <div class="lab-count">${l.children.length} 个页面 →</div>
        </div>
      </button>`;
      }
      return `
      <a href="${l.path || '#'}" class="lab-card">
        <div class="lab-icon">${l.icon || '◆'}</div>
        <div class="lab-text">
          <div class="lab-name">${l.name || '未命名'}</div>
          <div class="lab-desc">${l.desc || ''}</div>
        </div>
      </a>`;
    }).join('');

    // group card click -> open picker modal
    const modal = document.getElementById('lab-modal');
    grid.addEventListener('click', e => {
      const btn = e.target.closest('[data-group]');
      if (!btn) return;
      const group = labs[+btn.dataset.group];
      document.getElementById('lab-modal-title').textContent = group.name || '';
      document.getElementById('lab-modal-list').innerHTML = group.children.map(c => `
        <a href="${c.path || '#'}" class="lab-modal-item">
          <div class="lab-icon">${c.icon || '◆'}</div>
          <div class="lab-text">
            <div class="lab-name">${c.name || '未命名'}</div>
            <div class="lab-desc">${c.desc || ''}</div>
          </div>
        </a>
      `).join('');
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';
    });

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }
    document.getElementById('lab-modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  })
  .catch(() => {
    document.getElementById('labs-grid').innerHTML = '<div class="empty"><p>暂时无法加载实验列表</p></div>';
  });
</script>

</body>
</html>
