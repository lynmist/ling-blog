<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<script src="js/theme.js"></script>
<title>实验 — ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="css/base.css" rel="stylesheet">
<style>
.labs-intro { padding-top: 3rem; font-size: 14px; color: var(--ink2); line-height: 2; max-width: 520px; }
.labs-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; padding-top: 3rem; }
.lab-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 0.6rem;
  padding: 1.6rem 1.4rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm);
  transition: transform .2s, box-shadow .2s, border-color .2s, background .25s;
}
.lab-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--blue-l); }
.lab-icon {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--blue-ll);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  color: var(--blue);
  font-size: 18px;
}
.lab-name { font-size: 15px; font-weight: 500; color: var(--ink); }
.lab-desc { font-size: 12px; color: var(--ink2); line-height: 1.6; }
footer { margin-top: 6rem; }
@media (max-width: 600px) {
  .labs-grid { grid-template-columns: 1fr; }
  .lab-card { flex-direction: row; align-items: center; gap: 1rem; padding: 1.2rem; }
  .lab-text { flex: 1; min-width: 0; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><span class="nav-dot"></span><span class="nav-name">ling</span></a>
    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="writing.html">Writing</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="more.html">More</a></li>
    </ul>
    <button class="theme-switch" type="button" onclick="toggleTheme()" aria-label="切换主题">
      <span class="switch-track">
        <span class="switch-thumb">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
      </span>
    </button>
  </div>
</nav>

<div class="page">
  <header class="page-header">
    <p class="page-eyebrow">Labs</p>
    <h1 class="page-title">实验</h1>
    <p class="page-sub">一些小工具、预览站点和其他想单独放出来的东西。</p>
  </header>

  <p class="labs-intro">每个卡片都是一个独立的小页面，放在 labs/ 下的单独文件夹里，随时可以增加或替换。</p>

  <div class="labs-grid" id="labs-grid"></div>

  <footer>
    <p>© 2026 ling</p>
    <p>Labs · Archive</p>
  </footer>
</div>

<script>
fetch('labs/index.json')
  .then(r => r.json())
  .then(labs => {
    const grid = document.getElementById('labs-grid');
    if (!labs || labs.length === 0) {
      grid.innerHTML = '<div class="empty"><p>还没有实验项目</p></div>';
      return;
    }
    grid.innerHTML = labs.map(l => `
      <a href="${l.path || '#'}" class="lab-card">
        <div class="lab-icon">${l.icon || '◆'}</div>
        <div class="lab-text">
          <div class="lab-name">${l.name || '未命名'}</div>
          <div class="lab-desc">${l.desc || ''}</div>
        </div>
      </a>
    `).join('');
  })
  .catch(() => {
    document.getElementById('labs-grid').innerHTML = '<div class="empty"><p>暂时无法加载实验列表</p></div>';
  });
</script>

</body>
</html>
