<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<script src="js/theme.js"></script>
<title>书架 — ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="css/base.css" rel="stylesheet">
<style>
.book-list { display: grid; grid-template-columns: 1fr; gap: 1rem; padding-top: 3rem; }
.book-card {
  display: flex; align-items: flex-start; gap: 1.2rem;
  padding: 1.4rem 1.6rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm);
  transition: transform .2s, box-shadow .2s, border-color .2s, background .25s;
}
.book-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--blue-l); }
.book-cover {
  width: 56px; height: 80px;
  background: var(--blue-ll);
  border: 1px solid var(--line);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  color: var(--blue);
  text-align: center;
  padding: 0.4rem;
  line-height: 1.4;
}
.book-main { min-width: 0; flex: 1; }
.book-meta { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem; }
.book-type {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--blue); background: var(--blue-ll);
  border: 1px solid var(--blue-l); border-radius: 99px;
  padding: 1px 8px;
}
.book-name { font-size: 16px; font-weight: 500; color: var(--ink); margin-bottom: 0.25rem; }
.book-author { font-size: 12px; color: var(--ink3); margin-bottom: 0.5rem; }
.book-desc { font-size: 13px; color: var(--ink2); line-height: 1.7; }
.book-card { cursor: pointer; }
.book-arrow {
  font-size: 15px; color: var(--ink4); flex-shrink: 0; align-self: center;
  transition: color .2s, transform .3s cubic-bezier(.2,.8,.2,1);
}
.book-card:hover .book-arrow { color: var(--blue); transform: translateX(4px); }

/* ── book detail overlay ── */
.book-overlay {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem;
  background: rgba(243, 246, 252, .6);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  opacity: 0; pointer-events: none;
  transition: opacity .3s;
}
html[data-theme="dark"] .book-overlay { background: rgba(9, 13, 21, .6); }
.book-overlay.open { opacity: 1; pointer-events: auto; }
.book-detail {
  position: relative;
  width: 100%; max-width: 560px; max-height: 86vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 30px 70px -20px rgba(60, 80, 140, .35), var(--shadow-md);
  padding: 2.4rem 2.2rem 2rem;
  transform: translateY(20px) scale(.96);
  transition: transform .35s cubic-bezier(.2,.8,.2,1);
}
.book-overlay.open .book-detail { transform: none; }
.detail-close {
  position: absolute; top: .9rem; right: .9rem;
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--line); background: transparent;
  color: var(--ink3); font-size: 13px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color .2s, border-color .2s, transform .25s;
}
.detail-close:hover { color: var(--ink); border-color: var(--ink3); transform: rotate(90deg); }
.detail-head { display: flex; gap: 1.8rem; align-items: flex-end; margin-bottom: 2.1rem; }
.detail-cover {
  position: relative;
  width: 128px; aspect-ratio: 3/4.1; flex-shrink: 0;
  border-radius: 4px 10px 10px 4px;
  background: linear-gradient(155deg, var(--c1, #7aa2ff), var(--c2, #5470c8));
  box-shadow: 0 18px 36px -12px rgba(40, 60, 110, .45);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  opacity: 0;
  transform: perspective(800px) rotateY(-28deg) translateY(10px);
}
.book-overlay.open .detail-cover { animation: cover-in .7s cubic-bezier(.2,.8,.2,1) .08s forwards; }
@keyframes cover-in { to { opacity: 1; transform: none; } }
.detail-cover::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 9px; z-index: 1;
  background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.14) 55%, rgba(0,0,0,.12));
}
.detail-cover::after {
  content: ''; position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(115deg, rgba(255,255,255,.22), transparent 42%);
}
.detail-cover span {
  writing-mode: vertical-rl;
  font-family: 'Noto Serif SC', serif;
  font-size: 17px; letter-spacing: .18em;
  color: rgba(255,255,255,.95);
  text-shadow: 0 1px 6px rgba(0,0,0,.3);
  max-height: 78%; overflow: hidden;
}
.detail-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.detail-info { min-width: 0; padding-bottom: .3rem; }
.detail-chips { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .9rem; }
.detail-status {
  font-size: 9px; letter-spacing: .14em;
  color: var(--ink3); border: 1px solid var(--line); border-radius: 99px;
  padding: 1px 8px;
}
.detail-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 1.7rem; font-weight: 400; color: var(--ink);
  line-height: 1.35; margin-bottom: .5rem;
}
.detail-author { font-size: 13px; color: var(--ink3); margin-bottom: .8rem; }
.detail-rating { font-size: 13px; letter-spacing: .12em; color: var(--blue); }
.detail-rating .num { font-size: 11px; color: var(--ink4); margin-left: .5rem; letter-spacing: .03em; }
.detail-h {
  font-size: 11px; letter-spacing: .2em; color: var(--ink4);
  font-weight: 400; margin-bottom: .8rem;
  display: flex; align-items: center; gap: .8rem;
}
.detail-h::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.detail-desc { font-size: 13.5px; color: var(--ink2); line-height: 2; margin-bottom: 1.8rem; }
.detail-review { font-family: 'Noto Serif SC', serif; font-size: 14px; color: var(--ink2); line-height: 2.1; }
.rise { opacity: 0; transform: translateY(14px); }
.book-overlay.open .rise { animation: d-rise .55s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--rd, .1s); }
@keyframes d-rise { to { opacity: 1; transform: none; } }

footer { margin-top: 6rem; }
@media (max-width: 600px) {
  .book-card { padding: 1.2rem; }
  .book-cover { width: 48px; height: 70px; }
  .book-detail { padding: 1.9rem 1.4rem 1.6rem; }
  .detail-head { gap: 1.2rem; margin-bottom: 1.7rem; }
  .detail-cover { width: 96px; }
  .detail-cover span { font-size: 14px; }
  .detail-name { font-size: 1.35rem; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><span class="nav-dot"></span><span class="nav-name">ling</span></a>
    <a href="more.html" class="nav-back">← Back</a>
    <button class="theme-switch" type="button" onclick="toggleTheme()" aria-label="切换主题">
      <span class="switch-track">
        <span class="switch-thumb">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
      </span>
    </button>
  </div>
</nav>

<div class="page">
  <header class="page-header">
    <p class="page-eyebrow">Bookshelf</p>
    <h1 class="page-title">书架</h1>
    <p class="page-sub">小说、散文和其他会留下痕迹的书。</p>
  </header>

  <div class="book-list" id="book-list"></div>

  <div class="book-overlay" id="book-overlay" aria-hidden="true">
    <div class="book-detail" role="dialog" aria-modal="true" aria-label="书籍详情">
      <button class="detail-close" id="detail-close" type="button" aria-label="关闭">✕</button>
      <div class="detail-head">
        <div class="detail-cover" id="d-cover"></div>
        <div class="detail-info">
          <div class="detail-chips rise" style="--rd:.14s">
            <span class="book-type" id="d-type"></span><span class="detail-status" id="d-status"></span>
          </div>
          <h2 class="detail-name rise" style="--rd:.22s" id="d-name"></h2>
          <p class="detail-author rise" style="--rd:.3s" id="d-author"></p>
          <div class="detail-rating rise" style="--rd:.38s" id="d-rating"></div>
        </div>
      </div>
      <div class="detail-body">
        <div class="rise" style="--rd:.46s">
          <h3 class="detail-h">简介</h3>
          <p class="detail-desc" id="d-desc"></p>
        </div>
        <div class="rise" style="--rd:.54s" id="d-review-wrap">
          <h3 class="detail-h">读后</h3>
          <p class="detail-review" id="d-review"></p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 ling</p>
    <p>Reading · Archive</p>
    <p class="busuanzi-count"><span id="busuanzi_container_site_pv" style="display:none">访问 <span id="busuanzi_value_site_pv"></span> 次</span><span id="busuanzi_container_site_uv" style="display:none"> · 访客 <span id="busuanzi_value_site_uv"></span> 人</span></p>
  </footer>
</div>

<script>
fetch('books/index.json')
  .then(r => r.json())
  .then(books => {
    const list = document.getElementById('book-list');
    if (!books || books.length === 0) {
      list.innerHTML = '<div class="empty"><p>还没有推荐的书</p></div>';
      return;
    }
    list.innerHTML = books.map(b => `
      <div class="book-card" role="button" tabindex="0">
        <div class="book-cover">书</div>
        <div class="book-main">
          <div class="book-meta">
            <span class="book-type">${b.type || '其他'}</span>
          </div>
          <div class="book-name">${b.name || '未命名'}</div>
          <div class="book-author">${b.author || ''}</div>
          <div class="book-desc">${b.desc || ''}</div>
        </div>
        <div class="book-arrow">→</div>
      </div>
    `).join('');
    list.querySelectorAll('.book-card').forEach((card, i) => {
      card.addEventListener('click', () => openBook(books[i]));
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBook(books[i]); } });
    });
  })
  .catch(() => {
    document.getElementById('book-list').innerHTML = '<div class="empty"><p>暂时无法加载书架</p></div>';
  });

/* book detail overlay */
const bookOverlay = document.getElementById('book-overlay');
function hueFrom(str) {
  let h = 0;
  for (const c of String(str)) h = (h * 31 + c.codePointAt(0)) % 360;
  return h;
}
function openBook(b) {
  const hue = hueFrom(b.name || '书');
  const cover = document.getElementById('d-cover');
  cover.style.setProperty('--c1', `hsl(${hue} 62% 72%)`);
  cover.style.setProperty('--c2', `hsl(${(hue + 34) % 360} 55% 50%)`);
  cover.innerHTML = b.cover ? `<img src="${b.cover}" alt="">` : `<span>${b.name || ''}</span>`;
  document.getElementById('d-type').textContent = b.type || '其他';
  const status = document.getElementById('d-status');
  status.textContent = b.status || '';
  status.style.display = b.status ? '' : 'none';
  document.getElementById('d-name').textContent = b.name || '未命名';
  document.getElementById('d-author').textContent = b.author || '';
  const rating = document.getElementById('d-rating');
  if (b.rating != null) {
    const full = Math.max(0, Math.min(5, Math.round(b.rating)));
    rating.innerHTML = '★'.repeat(full) + '☆'.repeat(5 - full) + `<span class="num">${b.rating} / 5</span>`;
    rating.style.display = '';
  } else {
    rating.style.display = 'none';
  }
  document.getElementById('d-desc').textContent = b.desc || '';
  const reviewWrap = document.getElementById('d-review-wrap');
  reviewWrap.style.display = b.review ? '' : 'none';
  document.getElementById('d-review').textContent = b.review || '';
  bookOverlay.classList.add('open');
  bookOverlay.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeBook() {
  bookOverlay.classList.remove('open');
  bookOverlay.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
bookOverlay.addEventListener('click', e => { if (e.target === bookOverlay) closeBook(); });
document.getElementById('detail-close').addEventListener('click', closeBook);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBook(); });
</script>

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
