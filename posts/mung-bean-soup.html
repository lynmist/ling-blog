下班回到家，第一件事是把绿豆泡上。其实泡不泡都行，但总觉得泡过了，汤会更沙一些。这是一种没有根据的执念。

绿豆汤在锅里咕嘟了一个小时。关火，盛出来，放在桌上晾着。热气先是笔直地往上走，被窗缝里进来的风一吹，就歪了，散了。

> 热的东西凉下来需要时间，人也一样。

## 等待这件事

绿豆汤最好喝的时刻，不是刚煮好，也不是冰镇之后，而是温温的、刚好可以不烫嘴喝下去的那一小段。

但这一段很难等。要么忍不住烫了嘴，要么去干了点别的，回来的时候已经凉透了。

今天我决定就坐在桌边等。什么也不干，看着热气一点点变少，看窗外的天从亮橙色变成灰蓝色。

## 风扇和蝉

风扇开着最小档，摇头摇得很慢，每一次转过来，都像是特意来看我一眼。

蝉在楼下叫。它们从下午叫到晚上，也不知道累。小时候觉得蝉鸣很吵，现在觉得，没有蝉鸣的夏天，反而安静得让人心虚。

---

汤终于温了。端起来喝一口，绿豆已经煮开了花，沙糯沙糯的，甜味很淡。

一个下午就这样过去了。没有做成什么事，但好像也没有浪费。

夏天的日子，大概就是用来这样过的。
