    <h1 class="ah-title">傍晚路过一家花店</h1>

<script id="md-src" type="text/plain">
下班的时候绕了远路，不是因为什么特别的原因，只是不想那么快回家。

路过一家花店，门半开着，里面的灯是暖黄色的。我站在门口看了一会儿，没有进去。

> 有时候不进去，是因为进去了就结束了。不进去，它可以一直是那个样子。

花店的老板是个中年女人，正在给一束白色的花修剪枝条。她抬头看了我一眼，没有说话，继续低下头去。我觉得这个眼神很好——既不是"你要进来吗"，也不是"你干嘛"，就只是看了一眼。

## 关于傍晚这件事

傍晚是个奇怪的时间。它不属于白天，也还没到夜晚，像是一个过渡的缓冲区，专门用来放那些说不清楚的感受。

我在这种时刻总是容易想到一些具体的事情，比如某年冬天在某个地方吃过的一碗面，比如一个很久没联系的朋友，比如一句说了一半就停下来的话。

这些事情平时藏得很好，到了傍晚就会自己跑出来。

---

后来我还是进去了。买了一枝满天星，店主用牛皮纸给我包好，说了一声"慢走"。

出门的时候天已经完全暗了。手里拿着那枝花，走了很长一段路才到家。进门的时候发现自己心情还不错，也说不清楚为什么。

可能就是那束光，和那个眼神。
