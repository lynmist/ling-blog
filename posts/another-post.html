下雨天出门拍照是一件需要下定决心的事。

不是因为麻烦，是因为相机怕水，每次都要在"今天光线很好"和"但是会淋湿"之间反复权衡。大多数时候我选择不去，然后在家里看窗外的雨发呆，觉得错过了什么。

这次我去了。

## 雨里的光

雨天的漫射光是摄影师很喜欢说的东西，但亲身感受之前我一直不太理解那是什么意思。

直到站在街上，发现周围一切都变得均匀了——没有硬影子，没有过曝的高光，每个细节都清晰地待在原位，像是被什么仔细地擦拭过。

![](https://images.unsplash.com/photo-1519692933481-e162a57d6721?w=900&auto=format&fit=crop)

*路灯映在水里，比真实的更亮*

积水是意外的收获。地面上每一滩水都是一面镜子，天空、路灯、行人，全部倒进去。我蹲下来，把镜头放得很低，发现地面上有另一个世界。

> 有时候换一个视角不需要走很远，只需要蹲下来。

## 关于淋雨这件事

我还是淋湿了一点。

包用外套盖着，相机用手挡着，自己就这样暴露在外面。走了大概两个小时，回家换衣服的时候发现肩膀全湿了，但是不觉得冷，也不觉得后悔。

拍了大概两百张，回来选了十几张留下来。雨停之后我又出去了一次，想看看干燥的地面和刚才有什么不同。

区别很大。那种漫射的、均匀的光消失了，影子回来了，一切都变得普通了。

---

所以雨天还是要出去的。相机可以擦干，但那个光等不了。
