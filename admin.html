<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<title>Admin — ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F7F9FC; --panel: #FFFFFF;
  --blue: #5B9EC9; --blue-l: #B8D9EF; --blue-ll: #E4F3FB; --blue-d: #2A6FA0;
  --line: #DDE8F0; --ink: #1C2B38; --ink2: #4A6070; --ink3: #8AAABB; --ink4: #C0D4DF;
  --green: #4CAF82; --green-l: #E0F5EC;
}
html, body { height: 100%; }
body { font-family: 'Noto Sans SC','Inter',sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }

.topbar { height: 52px; flex-shrink: 0; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 1.5rem; gap: 1rem; }
.topbar-logo { display: flex; align-items: center; gap: 8px; }
.nav-dot { width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg,var(--blue),var(--blue-l)); }
.topbar-name { font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
.topbar-sep { color: var(--line); }
.topbar-title { font-size: 12px; color: var(--ink3); letter-spacing: 0.08em; }
.topbar-actions { margin-left: auto; display: flex; gap: 8px; }
.btn { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 16px; border-radius: 99px; cursor: pointer; border: 1px solid var(--line); font-family: inherit; transition: all .15s; display: inline-flex; align-items: center; gap: 6px; }
.btn-ghost { background: transparent; color: var(--ink2); }
.btn-ghost:hover { background: var(--blue-ll); color: var(--ink); border-color: var(--blue-l); }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: var(--blue-d); }
.btn-success { background: var(--green); color: #fff; border-color: var(--green); }
.btn-success:hover { opacity: 0.88; }

.workspace { flex: 1; display: grid; grid-template-columns: 260px 1fr 1fr; min-height: 0; }

/* sidebar */
.sidebar { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; overflow-y: auto; position: relative; }
.sidebar-section { padding: 1.2rem 1.4rem 0.8rem; border-bottom: 1px solid var(--line); }
.sidebar-label { font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink3); margin-bottom: 0.9rem; }
.field { margin-bottom: 0.8rem; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink3); margin-bottom: 5px; }
.field input { width: 100%; padding: 7px 10px; font-size: 13px; color: var(--ink); font-family: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; outline: none; transition: border-color .15s; }
.field input:focus { border-color: var(--blue-l); background: var(--panel); }
.field select { width: 100%; padding: 7px 10px; font-size: 13px; color: var(--ink); font-family: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; outline: none; cursor: pointer; transition: border-color .15s; }
.field select:focus { border-color: var(--blue-l); background: var(--panel); }
.check-label { display: flex !important; align-items: center; gap: 0.5rem; font-size: 12px !important; letter-spacing: 0.02em !important; text-transform: none !important; color: var(--ink2) !important; cursor: pointer; margin-bottom: 0 !important; }
.check-label input { width: auto !important; cursor: pointer; }
.slug-preview { margin-top: 4px; font-size: 10px; color: var(--ink3); font-family: 'Inter',monospace; letter-spacing: 0.04em; }

.article-list { flex: 1; }
.article-item { padding: 0.9rem 1.4rem; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; display: flex; justify-content: space-between; align-items: start; gap: 0.5rem; }
.article-item:hover { background: var(--blue-ll); }
.article-item.active { background: var(--blue-ll); border-left: 2px solid var(--blue); padding-left: calc(1.4rem - 2px); }
.ai-title { font-size: 13px; color: var(--ink); line-height: 1.4; margin-bottom: 3px; }
.ai-meta { font-size: 10px; color: var(--ink3); letter-spacing: 0.06em; display: flex; align-items: center; gap: 6px; }
.ai-tag { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--blue); background: var(--blue-ll); border: 1px solid var(--blue-l); border-radius: 99px; padding: 1px 8px; }
.ai-del { font-size: 15px; color: var(--ink4); background: none; border: none; cursor: pointer; padding: 0 2px; transition: color .15s; flex-shrink: 0; line-height: 1; }
.ai-del:hover { color: #E05C5C; }
.new-btn { margin: 1rem 1.4rem; width: calc(100% - 2.8rem); padding: 8px; border-radius: 8px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--blue); background: var(--blue-ll); border: 1px dashed var(--blue-l); cursor: pointer; font-family: inherit; transition: all .15s; }
.new-btn:hover { background: var(--panel); border-style: solid; }

/* editor */
.editor-pane { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
.pane-header { height: 40px; flex-shrink: 0; padding: 0 1.2rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; background: var(--bg); }
.pane-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink3); }
.char-count { margin-left: auto; font-size: 10px; color: var(--ink4); font-family: 'Inter',sans-serif; }
#md-editor { flex: 1; resize: none; outline: none; border: none; padding: 1.4rem; font-family: 'Inter','Noto Sans SC',monospace; font-size: 14px; line-height: 1.85; color: var(--ink2); background: var(--panel); tab-size: 2; }
#md-editor::placeholder { color: var(--ink4); }

/* preview */
.preview-pane { display: flex; flex-direction: column; min-height: 0; }
.preview-scroll { flex: 1; overflow-y: auto; padding: 2rem 2.5rem; }
.preview-header { margin-bottom: 2rem; padding-bottom: 2rem; border-bottom: 1px solid var(--line); }
.preview-eyebrow { font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--blue); display: flex; align-items: center; gap: 8px; margin-bottom: 1.2rem; }
.preview-eyebrow::before { content:''; width:12px; height:1px; background:var(--blue); display:block; }
.preview-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 1.2rem; }
.preview-tag { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--blue); padding: 2px 10px; border: 1px solid var(--blue-l); background: var(--blue-ll); border-radius: 99px; }
.preview-date { font-size: 11px; color: var(--ink4); font-family: 'Inter',sans-serif; }
.preview-author { font-size: 11px; color: var(--ink3); font-family: 'Inter',sans-serif; }
.preview-title { font-family: 'Noto Serif SC',serif; font-size: 1.6rem; font-weight: 300; color: var(--ink); line-height: 1.35; margin-bottom: 1rem; }
.preview-lead { font-size: 13px; color: var(--ink3); line-height: 1.8; padding-left: 0.9rem; border-left: 1.5px solid var(--blue-l); }
.preview-cover { margin-bottom: 1.5rem; }
.preview-cover img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
.preview-cover-cap { font-size: 11px; color: var(--ink4); font-style: italic; text-align: center; margin-top: 0.5rem; }
.md-preview p { font-family: 'Noto Serif SC',serif; font-size: 15px; font-weight: 300; color: var(--ink); line-height: 2.1; margin-bottom: 1.6rem; }
.md-preview h2 { font-family: 'Noto Serif SC',serif; font-size: 1.05rem; font-weight: 400; color: var(--ink); margin: 2.5rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--line); }
.md-preview h3 { font-family: 'Noto Serif SC',serif; font-size: 0.95rem; font-weight: 400; color: var(--ink2); margin: 2rem 0 0.8rem; }
.md-preview blockquote { margin: 2rem 0; padding: 0.2rem 0 0.2rem 1.2rem; border-left: 1.5px solid var(--blue-l); }
.md-preview blockquote p { color: var(--ink3) !important; font-style: italic; font-size: 14px !important; margin-bottom: 0 !important; }
.md-preview img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; margin: 1.5rem 0 0.4rem; }
.md-preview hr { border: none; height: 1px; background: var(--line); margin: 2.5rem 0; }
.md-preview ul, .md-preview ol { padding-left: 1.4rem; margin-bottom: 1.6rem; }
.md-preview li { font-family: 'Noto Serif SC',serif; font-size: 14px; font-weight: 300; color: var(--ink); line-height: 2; }
.md-preview ul li::marker { color: var(--blue-l); }
.md-preview strong { font-weight: 500; }
.md-preview em { font-style: italic; color: var(--ink2); }
.md-preview a { color: var(--blue); }
.md-preview code { font-family: 'Inter',monospace; font-size: 12px; background: var(--blue-ll); color: var(--blue-d); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }

/* export modal */
.modal-bg { position: fixed; inset: 0; background: rgba(28,43,56,0.45); z-index: 500; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-bg.hidden { display: none; }
.modal { background: var(--panel); border-radius: 14px; border: 1px solid var(--line); padding: 2rem; width: 480px; max-width: 90vw; }
.modal h2 { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 0.5rem; }
.modal p { font-size: 12px; color: var(--ink3); line-height: 1.7; margin-bottom: 1.5rem; }
.modal-steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.8rem; }
.step { display: flex; align-items: start; gap: 12px; }
.step-num { width: 22px; height: 22px; border-radius: 50%; background: var(--blue-ll); border: 1px solid var(--blue-l); color: var(--blue); font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.step-text { font-size: 12px; color: var(--ink2); line-height: 1.7; }
.step-text code { font-family: 'Inter',monospace; font-size: 11px; background: var(--bg); color: var(--blue-d); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* toast */
.toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 12px; letter-spacing: 0.08em; padding: 8px 20px; border-radius: 99px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 999; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-logo">
    <span class="nav-dot"></span>
    <span class="topbar-name">ling</span>
  </div>
  <span class="topbar-sep">·</span>
  <span class="topbar-title">Article Admin</span>
  <div class="topbar-actions">
    <button class="btn btn-ghost" id="btn-preview">↗ 预览</button>
    <button class="btn btn-ghost" id="btn-copy-md">复制 MD</button>
    <button class="btn btn-success" id="btn-export">⬇ 导出发布</button>
  </div>
</header>

<div class="workspace">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <p class="sidebar-label">文章元信息</p>
      <div class="field">
        <label>标题</label>
        <input id="f-title" type="text" placeholder="文章标题">
      </div>
      <div class="field">
        <label>URL Slug（英文，用于链接）</label>
        <input id="f-slug" type="text" placeholder="my-first-post">
        <div class="slug-preview" id="slug-preview">posts/my-first-post.html</div>
      </div>
      <div class="field">
        <label>导读</label>
        <input id="f-lead" type="text" placeholder="一句话导读">
      </div>
      <div class="field">
        <label>分类</label>
        <input id="f-tag" type="text" placeholder="随笔">
      </div>
      <div class="field">
        <label>日期</label>
        <input id="f-date" type="text" placeholder="2025.06.14">
      </div>
      <div class="field">
        <label>作者</label>
        <input id="f-author" type="text" placeholder="ling">
      </div>
      <div class="field">
        <label>作者主页链接</label>
        <input id="f-author-url" type="text" placeholder="https://yling2719.top/about.html">
      </div>
      <div class="field">
        <label>封面图 URL</label>
        <input id="f-cover" type="text" placeholder="https://...">
      </div>
      <div class="field">
        <label>封面说明</label>
        <input id="f-cover-cap" type="text" placeholder="图片说明">
      </div>
      <div class="field">
        <label>样式主题</label>
        <select id="f-theme">
          <option value="post-blue">蔚蓝（默认）</option>
          <option value="post-warm">暖调</option>
        </select>
      </div>
      <div class="field">
        <label class="check-label"><input id="f-busuanzi" type="checkbox" checked> 页脚显示阅读计数（不蒜子）</label>
      </div>
    </div>
    <div class="sidebar-section" style="padding-bottom:0.6rem">
      <p class="sidebar-label">已保存草稿</p>
    </div>
    <div class="article-list" id="article-list"></div>
    <button class="new-btn" id="btn-new">＋ 新建文章</button>
  </aside>

  <!-- Editor -->
  <div class="editor-pane">
    <div class="pane-header">
      <span class="pane-label">Markdown 编辑器</span>
      <span class="char-count" id="char-count">0 字</span>
    </div>
    <textarea id="md-editor" spellcheck="false"
      placeholder="在这里写 Markdown 正文…

## 小标题
**粗体** *斜体* `代码`
> 引用块
![图片说明](https://...)
- 列表项
--- 分割线"></textarea>
  </div>

  <!-- Preview -->
  <div class="preview-pane">
    <div class="pane-header">
      <span class="pane-label">实时预览</span>
    </div>
    <div class="preview-scroll">
      <div class="preview-header">
        <p class="preview-eyebrow">Writing</p>
        <div class="preview-meta">
          <span class="preview-tag" id="pv-tag">随笔</span>
          <span class="preview-date" id="pv-date"></span>
          <span class="preview-author" id="pv-author"></span>
        </div>
        <h1 class="preview-title" id="pv-title" style="color:var(--ink4);font-style:italic">输入标题后显示…</h1>
        <p class="preview-lead" id="pv-lead" style="display:none"></p>
      </div>
      <div class="preview-cover" id="pv-cover" style="display:none">
        <img id="pv-cover-img" src="" alt="">
        <p class="preview-cover-cap" id="pv-cover-cap"></p>
      </div>
      <div class="md-preview" id="pv-body"></div>
    </div>
  </div>
</div>

<!-- Export modal -->
<div class="modal-bg hidden" id="export-modal">
  <div class="modal">
    <h2>导出并发布</h2>
    <p>导出后按下面步骤放进你的 GitHub 仓库，push 后自动部署。</p>
    <div class="modal-steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text">点击下方按钮，下载文章 HTML 和更新后的 <code>index.json</code></div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text">将文章 HTML 放入仓库的 <code>posts/</code> 文件夹</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text">将 <code>index.json</code> 放入 <code>posts/</code> 文件夹（替换旧的）</div>
      </div>
      <div class="step">
        <div class="step-num">4</div>
        <div class="step-text">Push 到 GitHub，Cloudflare Pages 自动部署完成 ✓</div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-dl-post">⬇ 下载文章 HTML</button>
      <button class="btn btn-success" id="modal-dl-index">⬇ 下载 index.json</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORE_KEY = 'ling_v3_articles';
const STORE_IDX = 'ling_v3_published';
// live site origin, used only to make blob:// preview pages resolve relative assets
const SITE_ORIGIN = 'https://yling2719.top';

// ── helpers ──
function slugify(str) {
  return str.toLowerCase()
    .replace(/[\u4e00-\u9fa5]+/g, '')  // remove CJK
    .replace(/[^a-z0-9\s-]/g, '')
    .trim().replace(/\s+/g, '-')
    .replace(/-+/g, '-') || 'post-' + Date.now();
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

// escape a value before interpolating it into HTML markup
function escapeHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── storage ──
function loadDrafts() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; } }
function saveDrafts(a) { localStorage.setItem(STORE_KEY, JSON.stringify(a)); }
function loadPublished() { try { return JSON.parse(localStorage.getItem(STORE_IDX)) || []; } catch { return []; } }
function savePublished(a) { localStorage.setItem(STORE_IDX, JSON.stringify(a)); }

let drafts = loadDrafts();
let currentId = null;

// ── init ──
function init() {
  marked.use({ breaks: true, gfm: true });
  renderList();
  if (drafts.length > 0) loadDraft(drafts[0].id);
  else newDraft();
  bindEvents();
}

// ── list ──
function renderList() {
  const el = document.getElementById('article-list');
  if (!drafts.length) {
    el.innerHTML = '<div style="padding:1.4rem;font-size:12px;color:var(--ink4);text-align:center">暂无草稿</div>';
    return;
  }
  el.innerHTML = drafts.map(a => `
    <div class="article-item ${a.id===currentId?'active':''}" data-id="${a.id}">
      <div>
        <div class="ai-title">${escapeHtml(a.title) || '无标题'}</div>
        <div class="ai-meta"><span class="ai-tag">${escapeHtml(a.tag)||'随笔'}</span><span class="ai-date">${escapeHtml(a.date)}</span></div>
      </div>
      <button class="ai-del" data-del="${a.id}">×</button>
    </div>`).join('');
}

// update only the active item's visible meta, without rebuilding the whole list
function syncListItem() {
  const item = document.querySelector(`.article-item[data-id="${currentId}"]`);
  const a = drafts.find(x => x.id===currentId);
  if (!item || !a) { renderList(); return; }
  item.querySelector('.ai-title').textContent = a.title || '无标题';
  item.querySelector('.ai-tag').textContent = a.tag || '随笔';
  item.querySelector('.ai-date').textContent = a.date || '';
}

function loadDraft(id) {
  const a = drafts.find(x => x.id===id);
  if (!a) return;
  currentId = id;
  document.getElementById('f-title').value    = a.title    || '';
  document.getElementById('f-slug').value     = a.slug     || '';
  document.getElementById('f-lead').value     = a.lead     || '';
  document.getElementById('f-tag').value      = a.tag      || '随笔';
  document.getElementById('f-date').value     = a.date     || today();
  document.getElementById('f-author').value   = a.author   || 'ling';
  document.getElementById('f-author-url').value = a.authorUrl || 'https://yling2719.top/about.html';
  document.getElementById('f-cover').value    = a.cover    || '';
  document.getElementById('f-cover-cap').value= a.coverCap || '';
  document.getElementById('f-theme').value    = a.theme    || 'post-blue';
  document.getElementById('f-busuanzi').checked = a.busuanzi !== false;
  document.getElementById('md-editor').value  = a.body     || '';
  applyPreviewTheme();
  updateSlugPreview();
  updatePreview();
  updateCount();
  renderList();
}

function newDraft() {
  const id = 'draft_' + Date.now();
  drafts.unshift({ id, title:'', slug:'', lead:'', tag:'随笔', date:today(), author:'ling', authorUrl:'https://yling2719.top/about.html', cover:'', coverCap:'', theme:'post-blue', busuanzi:true, body:'' });
  saveDrafts(drafts);
  loadDraft(id);
}

function deleteDraft(id) {
  if (!confirm('删除这篇草稿？')) return;
  drafts = drafts.filter(x => x.id!==id);
  saveDrafts(drafts);
  if (currentId===id) { currentId=null; drafts.length ? loadDraft(drafts[0].id) : newDraft(); }
  else renderList();
}

function autoSave() {
  if (!currentId) return;
  const i = drafts.findIndex(x => x.id===currentId);
  if (i===-1) return;
  drafts[i] = { ...drafts[i],
    title:    document.getElementById('f-title').value,
    slug:     document.getElementById('f-slug').value,
    lead:     document.getElementById('f-lead').value,
    tag:      document.getElementById('f-tag').value,
    date:     document.getElementById('f-date').value,
    author:   document.getElementById('f-author').value,
    authorUrl: document.getElementById('f-author-url').value,
    cover:    document.getElementById('f-cover').value,
    coverCap: document.getElementById('f-cover-cap').value,
    theme:    document.getElementById('f-theme').value,
    busuanzi: document.getElementById('f-busuanzi').checked,
    body:     document.getElementById('md-editor').value,
  };
  saveDrafts(drafts);
  syncListItem();
}

// ── slug ──
function updateSlugPreview() {
  const slug = document.getElementById('f-slug').value || 'post';
  document.getElementById('slug-preview').textContent = `posts/${slug}.html`;
}

// ── preview ──
function updatePreview() {
  autoSave();
  const title    = document.getElementById('f-title').value;
  const lead     = document.getElementById('f-lead').value;
  const tag      = document.getElementById('f-tag').value || '随笔';
  const date     = document.getElementById('f-date').value;
  const cover    = document.getElementById('f-cover').value;
  const coverCap = document.getElementById('f-cover-cap').value;
  const body     = document.getElementById('md-editor').value;

  const pvTitle = document.getElementById('pv-title');
  const pvLead  = document.getElementById('pv-lead');
  pvTitle.textContent = title || '输入标题后显示…';
  pvTitle.style.color = title ? '' : 'var(--ink4)';
  pvTitle.style.fontStyle = title ? '' : 'italic';
  pvLead.textContent = lead;
  pvLead.style.display = lead ? '' : 'none';
  document.getElementById('pv-tag').textContent  = tag;
  document.getElementById('pv-date').textContent = date;
  document.getElementById('pv-author').textContent = document.getElementById('f-author').value ? 'By ' + document.getElementById('f-author').value : '';

  const coverEl = document.getElementById('pv-cover');
  if (cover.trim()) {
    document.getElementById('pv-cover-img').src = cover;
    document.getElementById('pv-cover-cap').textContent = coverCap;
    coverEl.style.display = '';
  } else { coverEl.style.display = 'none'; }

  document.getElementById('pv-body').innerHTML = marked.parse(body || '');

  // style img captions
  document.querySelectorAll('#pv-body img').forEach(img => {
    const par = img.closest('p'); if (!par) return;
    const next = par.nextElementSibling;
    if (next && next.tagName==='P' && next.querySelector('em') && next.childNodes.length===1)
      next.style.cssText = 'font-size:11px;color:var(--ink4);font-style:italic;text-align:center;margin-top:-1rem;margin-bottom:1.5rem;';
  });
}

function updateCount() {
  const text = document.getElementById('md-editor').value;
  const n = (text.match(/[\u4e00-\u9fa5]/g)||[]).length + (text.match(/[a-zA-Z]+/g)||[]).length;
  document.getElementById('char-count').textContent = n + ' 字';
}

// ── build post HTML ──
function getData() {
  return {
    title:    document.getElementById('f-title').value,
    slug:     document.getElementById('f-slug').value || slugify(document.getElementById('f-title').value),
    lead:     document.getElementById('f-lead').value,
    tag:      document.getElementById('f-tag').value || '随笔',
    date:     document.getElementById('f-date').value,
    author:   document.getElementById('f-author').value || 'ling',
    authorUrl: document.getElementById('f-author-url').value,
    cover:    document.getElementById('f-cover').value,
    coverCap: document.getElementById('f-cover-cap').value,
    theme:    document.getElementById('f-theme').value || 'post-blue',
    busuanzi: document.getElementById('f-busuanzi').checked,
    body:     document.getElementById('md-editor').value,
  };
}

function buildPostHTML(d) {
  // escape every field interpolated into the markup; body is escaped separately at the md-src tag below
  const title = escapeHtml(d.title);
  const tag = escapeHtml(d.tag);
  const date = escapeHtml(d.date);
  const author = escapeHtml(d.author);
  const authorUrl = escapeHtml(d.authorUrl);
  const lead = escapeHtml(d.lead);
  const cover = escapeHtml(d.cover);
  const coverCap = escapeHtml(d.coverCap);
  const theme = escapeHtml(d.theme);
  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../favicon.ico" type="image/x-icon">
<script src="../js/theme.js"><\/script>
<title>${title} — ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="../css/${theme}.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"><\/script>
</head>
<body>
<nav><div class="nav-inner">
  <a href="../index.html" class="nav-logo"><span class="nav-dot"></span><span class="nav-name">ling</span></a>
  <a href="../writing.html" class="nav-back">← 全部文章</a>
  <button class="theme-switch" type="button" onclick="toggleTheme()" aria-label="切换主题">
    <span class="switch-track">
      <span class="switch-thumb">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
    </span>
  </button>
</div></nav>
<div class="page">
  <header class="article-header">
    <p class="ah-eyebrow">Writing</p>
    <div class="ah-meta">
      <span class="ah-tag">${tag}</span>
      <span class="ah-date">${date}</span>
      ${d.author ? `<span class="ah-author">By ${d.authorUrl ? `<a href="${authorUrl}">${author}</a>` : author}</span>` : ''}
    </div>
    <h1 class="ah-title">${title}</h1>
    ${d.lead ? `<p class="ah-lead">${lead}</p>` : ''}
  </header>
  ${d.cover ? `<div class="cover-wrap"><div class="cover-box"><img src="${cover}" alt="cover"></div>${d.coverCap ? `<p class="cover-cap">${coverCap}</p>` : ''}</div>` : ''}
  <article class="article-body">
    <div class="md-body" id="md-output"></div>
  </article>
  <footer class="article-footer">
    <p id="wc-out">© 2026 ling</p>
    ${d.busuanzi ? `<p class="busuanzi-count"><span id="busuanzi_container_page_pv" style="display:none">本文被阅读 <span id="busuanzi_value_page_pv"></span> 次</span></p>` : ''}
    <a href="../writing.html" class="back-link">← 全部文章</a>
  </footer>
</div>
<script id="md-src" type="text/plain">${d.body.replace(/</g,'&lt;').replace(/>/g,'&gt;')}<\/script>
<script src="../js/post.js"><\/script>
${d.busuanzi ? `<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"><\/script>` : ''}
</body>
</html>`;
}

// ── export ──
function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function doExportPost() {
  const d = getData();
  if (!d.title) { showToast('请先填写文章标题'); return; }
  const html = buildPostHTML(d);
  downloadBlob(html, `${d.slug}.html`, 'text/html;charset=utf-8');
  showToast(`已下载 posts/${d.slug}.html`);
}

function doExportIndex() {
  const d = getData();
  if (!d.title) { showToast('请先填写文章标题'); return; }
  // update published index
  let published = loadPublished();
  const existing = published.findIndex(x => x.slug === d.slug);
  const entry = { slug: d.slug, title: d.title, tag: d.tag, theme: d.theme, date: d.date, author: d.author, authorUrl: d.authorUrl, lead: d.lead };
  if (existing > -1) published[existing] = entry;
  else published.unshift(entry);
  savePublished(published);
  downloadBlob(JSON.stringify(published, null, 2), 'index.json', 'application/json;charset=utf-8');
  showToast('已下载 posts/index.json');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── theme swatches for live preview (scoped to .preview-scroll only) ──
const THEMES = {
  'post-blue': { blue:'#5B9EC9', blueL:'#B8D9EF', blueLl:'#E4F3FB' },
  'post-warm': { blue:'#C98B5B', blueL:'#E8D2BC', blueLl:'#F3E9DD' },
};
function applyPreviewTheme() {
  const key = document.getElementById('f-theme').value || 'post-blue';
  const t = THEMES[key] || THEMES['post-blue'];
  const scroll = document.querySelector('.preview-scroll');
  scroll.style.setProperty('--blue', t.blue);
  scroll.style.setProperty('--blue-l', t.blueL);
  scroll.style.setProperty('--blue-ll', t.blueLl);
}

// ── bind events ──
function bindEvents() {
  document.getElementById('btn-new').addEventListener('click', newDraft);
  document.getElementById('btn-preview').addEventListener('click', () => {
    const d = getData();
    let html = buildPostHTML(d);
    // blob:// pages can't resolve relative ../css/*.css — swap to the live site's absolute URL for preview only
    html = html.replace(`../css/${d.theme}.css`, `${SITE_ORIGIN}/css/${d.theme}.css`)
                .replace('../js/post.js', `${SITE_ORIGIN}/js/post.js`)
                .replace('../js/theme.js', `${SITE_ORIGIN}/js/theme.js`)
                .replace('href="../favicon.ico"', `href="${SITE_ORIGIN}/favicon.ico"`)
                .replace(/href="\.\.\/index\.html"/g, `href="${SITE_ORIGIN}/index.html"`)
                .replace(/href="\.\.\/writing\.html"/g, `href="${SITE_ORIGIN}/writing.html"`);
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    window.open(URL.createObjectURL(blob), '_blank');
  });
  document.getElementById('btn-copy-md').addEventListener('click', () => {
    const d = getData();
    navigator.clipboard.writeText(d.body).then(() => showToast('Markdown 已复制'));
  });
  document.getElementById('btn-export').addEventListener('click', () => {
    document.getElementById('export-modal').classList.remove('hidden');
  });
  document.getElementById('modal-cancel').addEventListener('click', () => {
    document.getElementById('export-modal').classList.add('hidden');
  });
  document.getElementById('modal-dl-post').addEventListener('click', doExportPost);
  document.getElementById('modal-dl-index').addEventListener('click', doExportIndex);

  // article list clicks
  document.getElementById('article-list').addEventListener('click', e => {
    const item = e.target.closest('.article-item');
    const del  = e.target.closest('[data-del]');
    if (del) { e.stopPropagation(); deleteDraft(del.dataset.del); return; }
    if (item) loadDraft(item.dataset.id);
  });

  // field inputs
  ['f-title','f-lead','f-tag','f-date','f-author','f-author-url','f-cover','f-cover-cap','f-theme'].forEach(id => {
    document.getElementById(id).addEventListener('input', updatePreview);
  });
  document.getElementById('f-theme').addEventListener('change', applyPreviewTheme);
  document.getElementById('f-busuanzi').addEventListener('change', autoSave);
  document.getElementById('f-slug').addEventListener('input', () => {
    updateSlugPreview();
    autoSave();
  });
  document.getElementById('f-title').addEventListener('input', () => {
    const slugEl = document.getElementById('f-slug');
    if (!slugEl.value) {
      slugEl.value = slugify(document.getElementById('f-title').value);
      updateSlugPreview();
    }
  });
  document.getElementById('md-editor').addEventListener('input', () => {
    updatePreview();
    updateCount();
  });
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
