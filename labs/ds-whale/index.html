<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鲸潜 · The Dive — 深度求索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04070f;
  --ink: #e6eef7;
  --dim: #7f91a8;
  --faint: #43556e;
  --serif: 'Noto Serif SC', serif;
  --latin: 'Cormorant Garamond', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-weight: 300;
  height: 100vh; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(120,180,230,.3); }

#cv {
  position: fixed; inset: 0; z-index: 1;
  width: 100vw; height: 100vh; display: block;
  cursor: crosshair;
}

/* 文案层 */
.caption {
  position: fixed; z-index: 25; pointer-events: none;
  left: 6vw; bottom: 7vh;
}
.caption .no {
  font-family: var(--latin); font-style: italic;
  font-size: 13px; letter-spacing: .34em; color: var(--faint);
}
.caption h1 {
  font-size: clamp(34px, 4.6vw, 58px); font-weight: 200;
  letter-spacing: .34em; margin: 14px 0 8px;
  background: linear-gradient(110deg, #eef6ff, #9cc8e6 45%, #3f7ea6);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.caption .sci {
  font-family: var(--latin); font-style: italic;
  font-size: 15px; letter-spacing: .16em; color: #7da3c4;
}
.caption p {
  margin-top: 20px; max-width: 320px;
  font-size: 12px; line-height: 2.2; letter-spacing: .14em; color: var(--dim);
}
.spec {
  position: fixed; z-index: 25; pointer-events: none;
  right: 6vw; bottom: 7vh; text-align: right;
  font-size: 11px; letter-spacing: .26em; color: var(--faint); line-height: 2.4;
}
.spec b { color: var(--dim); font-weight: 400; }

.hint {
  position: fixed; z-index: 25; pointer-events: none;
  left: 50%; bottom: 4.5vh; transform: translateX(-50%);
  font-size: 10px; letter-spacing: .5em; text-indent: .5em; color: var(--faint);
  animation: hint 3.5s ease-in-out infinite;
}
@keyframes hint { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }

@media (max-width: 720px) {
  .caption { left: 7vw; bottom: 9vh; }
  .caption p { display: none; }
  .spec { display: none; }
}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div class="caption">
  <div class="no">PLATE 01 — CETACEA</div>
  <h1>鲸&thinsp;潜</h1>
  <div class="sci">Balaenoptera · 在深处思考</div>
  <p>上一条闪电是它的速度,这一头鲸是它的耐心:不抬头看光,只往暗处去。越沉,越接近问题的底。深海没有雷声,只有一次无声的潜行。</p>
</div>

<div class="spec">
  <div><b>姿态</b> 单笔 · 无素材</div>
  <div><b>粒子</b> 生物荧光 · 程序生成</div>
  <div><b>深度</b> 从海面到两千米</div>
  <div><b>思考</b> 不闪光时 · 也在潜</div>
</div>

<div class="hint">移动 · 惊散微光</div>

<script>
/* ═══════════ 鲸潜:单笔鲸 + 生物荧光粒子 ═══════════ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

let W = 0, H = 0, cx = 0, cy = 0;
let particles = [], orbs = [], bubbles = [];
let nextBlow = 0;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2; cy = H / 2;
  initParticles();
}
addEventListener('resize', resize);
resize();

/* 荧光光晕 sprite */
function makeGlow(size, inner, outer) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, inner);
  gr.addColorStop(0.45, outer);
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, size, size);
  return c;
}
const sprWhite = makeGlow(24, 'rgba(235,248,255,0.9)', 'rgba(140,200,235,0.28)');
const sprBlue  = makeGlow(24, 'rgba(190,225,255,0.8)', 'rgba(80,150,215,0.25)');
const sprDim   = makeGlow(24, 'rgba(200,225,250,0.7)', 'rgba(70,120,180,0.20)');

function initParticles() {
  particles = [];
  const n = Math.max(60, Math.min(200, Math.round(W * H / 9000)));
  for (let i = 0; i < n; i++) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.6 + Math.random() * 1.6,
      sp: 8 + Math.random() * 22,
      sway: Math.random() * 6 + 2, swayAmp: 8 + Math.random() * 18,
      tw: Math.random() * 3 + 1, ph: Math.random() * 6.28,
      spr: [sprWhite, sprBlue, sprDim][Math.floor(Math.random() * 3)]
    });
  }
  orbs = [];
  for (let i = 0; i < 4; i++) {
    orbs.push({ x: Math.random() * W, y: Math.random() * H, r: 60 + Math.random() * 90, a: 0.03 + Math.random() * 0.03, ph: Math.random() * 6.28 });
  }
}

/* 鲸的几何:局部坐标,鼻在 lx=0,尾根 lx=L */
const L = 0.86;
const hMax = x => 0.24 * Math.pow(Math.sin(Math.PI * Math.min(x, 1)), 0.7);
const wave = (x, t) => 0.05 * Math.pow(x, 1.3) * Math.sin(x * 9 - t * 2.6);
function ts(lx, ly, t) {
  const s = Math.min(W * 0.60, H * 1.02);
  const ang = -0.05 + Math.sin(t * 0.3) * 0.02;
  const dx = lx - 0.53, dy = ly;
  const rx = dx * Math.cos(ang) - dy * Math.sin(ang);
  const ry = dx * Math.sin(ang) + dy * Math.cos(ang);
  return {
    x: W * 0.5 + (0.53 - rx) * s,
    y: H * 0.52 + ry * s + Math.sin(t * 0.5) * 0.008 * H
  };
}

function quad(a, c, b, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, v = 1 - u;
    pts.push({ x: v * v * a.x + 2 * v * u * c.x + u * u * b.x, y: v * v * a.y + 2 * v * u * c.y + u * u * b.y });
  }
  return pts;
}

function buildWhale(t) {
  const main = [], fin = [];
  for (let x = 0; x <= L; x += 0.012) main.push(ts(x, -hMax(x) + wave(x, t), t));
  const tR = ts(L, wave(L, t), t);
  main.push(tR);

  const fluke = Math.sin(L * 9 - t * 2.6) * 0.5;
  const c = Math.cos(fluke), s = Math.sin(fluke);
  const flP = (dx, dy) => {
    const rx = dx * c - dy * s, ry = dx * s + dy * c;
    return ts(L + rx, wave(L, t) + ry, t);
  };
  const ftTop = flP(0.18, -0.155), ftBot = flP(0.18, 0.155), notch = flP(0.12, 0);
  main.push.apply(main, quad(tR, flP(0.08, -0.02), ftTop, 4));
  main.push.apply(main, quad(ftTop, flP(0.16, -0.07), notch, 4));
  main.push.apply(main, quad(notch, flP(0.16, 0.07), ftBot, 4));
  main.push.apply(main, quad(ftBot, flP(0.08, 0.02), tR, 4));

  for (let x = L; x >= 0; x -= 0.012) main.push(ts(x, hMax(x) + wave(x, t), t));

  const xf = 0.30, belly = hMax(xf) + wave(xf, t);
  const A = ts(xf, belly, t);
  const T = ts(xf - 0.015, belly + 0.115, t);
  const B = ts(0.44, hMax(0.44) + wave(0.44, t), t);
  fin.push(A, T, B, A);

  return { main, fin, hole: ts(0.30, -hMax(0.30) + wave(0.30, t), t) };
}

function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#071020');
  g.addColorStop(0.45, '#040a18');
  g.addColorStop(1, '#01030a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const x0 = W * (0.18 + 0.3 * i) + Math.sin(t * 0.18 + i * 2.1) * 30;
    const w = W * (0.10 + 0.04 * i);
    const lg = ctx.createLinearGradient(0, 0, 0, H * 0.75);
    lg.addColorStop(0, 'rgba(140,190,235,' + (0.05 - 0.012 * i) + ')');
    lg.addColorStop(1, 'rgba(140,190,235,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(x0 - w * 0.4, 0);
    ctx.lineTo(x0 + w * 0.4, 0);
    ctx.lineTo(x0 + w * 2.2, H * 0.75);
    ctx.lineTo(x0 - w * 2.2, H * 0.75);
    ctx.closePath();
    ctx.fill();
  }
  for (const o of orbs) {
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.4 + o.ph);
    const g2 = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
    g2.addColorStop(0, 'rgba(120,180,225,' + o.a * (0.6 + 0.4 * pulse) + ')');
    g2.addColorStop(1, 'rgba(120,180,225,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

function drawParticles(t, dt) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    p.y -= p.sp * dt;
    p.x += Math.sin(t * p.sway + p.ph) * p.swayAmp * dt;
    if (p.y < -14) { p.y = H + 12; p.x = Math.random() * W; }
    if (p.x < -14) p.x = W + 12;
    if (p.x > W + 14) p.x = -12;
    if (ptr) {
      const dx = p.x - ptr.x, dy = p.y - ptr.y;
      const d2 = dx * dx + dy * dy, R = 95;
      if (d2 < R * R && d2 > 1) {
        const d = Math.sqrt(d2);
        const f = (1 - d / R) * 70 * dt;
        p.x += dx / d * f;
        p.y += dy / d * f;
      }
    }
    const tw = 0.3 + 0.7 * Math.abs(Math.sin(t * p.tw + p.ph));
    const s = 20 * (p.r / 1.1);
    ctx.globalAlpha = Math.min(1, tw * (p.r / 2.2 + 0.5));
    ctx.drawImage(p.spr, p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.restore();
}

function strokePath(pts, alpha, w, blur) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(158,205,232,' + alpha + ')';
  ctx.lineWidth = w;
  ctx.shadowColor = 'rgba(90,160,215,' + alpha * 0.85 + ')';
  ctx.shadowBlur = blur;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.restore();
}

function revealPath(pts, f, alpha, w, blur) {
  if (pts.length < 2) return;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(178,214,240,' + alpha + ')';
  ctx.lineWidth = w;
  ctx.shadowColor = 'rgba(105,168,222,' + alpha + ')';
  ctx.shadowBlur = blur;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  let len = 0;
  for (let i = 1; i < pts.length; i++) {
    len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    ctx.lineTo(pts[i].x, pts[i].y);
  }
  ctx.setLineDash([len || 1, len || 1]);
  ctx.lineDashOffset = -(len || 1) * (1 - f);
  ctx.stroke();
  ctx.restore();
}

function drawBubbles(t, dt, now, hole) {
  if (now > nextBlow && bubbles.length < 36) {
    nextBlow = now + 1400 + Math.random() * 1600;
    const n = 4 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      bubbles.push({
        x: hole.x + (Math.random() - 0.5) * 18,
        y: hole.y - Math.random() * 8,
        r: 1.5 + Math.random() * 3.5,
        sp: 16 + Math.random() * 26,
        ph: Math.random() * 6.28,
        sw: Math.random() * 3 + 1
      });
    }
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.sp * dt;
    b.x += Math.sin(t * b.sw + b.ph) * 10 * dt;
    b.r += dt * 2.5;
    if (b.y < -16 || b.r > 11) { bubbles.splice(i, 1); continue; }
    ctx.strokeStyle = 'rgba(200,230,250,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, 6.2832);
    ctx.stroke();
    ctx.fillStyle = 'rgba(220,240,255,0.5)';
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

function vignette() {
  const g = ctx.createRadialGradient(cx, cy, Math.min(W, H) * 0.35, cx, cy, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,5,0.55)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

let ptr = null;
addEventListener('pointermove', e => { ptr = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerleave', () => { ptr = null; });

const easeOut = t => 1 - Math.pow(1 - t, 3);
const t0 = performance.now();
let last = performance.now();

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const t = now / 1000;
  const f = easeOut(Math.min((now - t0) / 3800, 1));

  drawBackground(t);
  drawParticles(t, dt);

  const w = buildWhale(t);
  strokePath(w.main, 0.05, 3, 26);
  strokePath(w.fin, 0.05, 3, 26);
  revealPath(w.main, f, 0.95, 1.7, 16);
  revealPath(w.fin, f, 0.8, 1.3, 14);
  drawBubbles(t, dt, now, w.hole);

  vignette();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
