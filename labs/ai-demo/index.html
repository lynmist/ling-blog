<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 对话示例</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f8fa;
  --surface: #ffffff;
  --ink: #1f2937;
  --ink2: #4b5563;
  --ink3: #9ca3af;
  --line: #e5e7eb;
  --blue: #3b82f6;
  --blue-ll: #eff6ff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827;
    --surface: #1f2937;
    --ink: #f3f4f6;
    --ink2: #d1d5db;
    --ink3: #6b7280;
    --line: #374151;
    --blue: #60a5fa;
    --blue-ll: #1e3a8a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  display: flex; flex-direction: column;
}
header {
  padding: 1.2rem 1.5rem;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
header h1 { margin: 0; font-size: 16px; font-weight: 500; }
header p { margin: 0.2rem 0 0; font-size: 12px; color: var(--ink3); }
.chat {
  flex: 1;
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
  padding: 1.5rem;
  display: flex; flex-direction: column; gap: 1rem;
}
.message {
  max-width: 80%;
  padding: 0.9rem 1.1rem;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.7;
}
.message.user {
  align-self: flex-end;
  background: var(--blue);
  color: #fff;
}
.message.ai {
  align-self: flex-start;
  background: var(--surface);
  border: 1px solid var(--line);
}
.input-area {
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
  padding: 1rem 1.5rem 2rem;
}
.input-box {
  display: flex; gap: 0.6rem;
  padding: 0.6rem 0.8rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
}
.input-box input {
  flex: 1;
  border: none; outline: none;
  background: transparent;
  color: var(--ink);
  font-size: 14px;
  padding: 0 0.4rem;
}
.input-box button {
  border: none; outline: none;
  background: var(--blue);
  color: #fff;
  font-size: 13px;
  padding: 0.5rem 1rem;
  border-radius: 999px;
  cursor: pointer;
}
.back {
  position: fixed;
  top: 1.2rem;
  right: 1.5rem;
  font-size: 12px;
  color: var(--ink3);
  text-decoration: none;
}
.back:hover { color: var(--blue); }
@media (max-width: 600px) {
  .message { max-width: 90%; }
}
</style>
</head>
<body>

<a class="back" href="../../labs.html">← 返回实验页</a>

<header>
  <h1>AI 对话示例</h1>
  <p>这是一个前端预览Demo，不会真正发送请求。</p>
</header>

<div class="chat" id="chat">
  <div class="message ai">你好，我是一个示例 AI。你可以输入任意内容，我会给出预设回复。</div>
</div>

<div class="input-area">
  <div class="input-box">
    <input type="text" id="msg" placeholder="输入消息..." autofocus>
    <button onclick="send()">发送</button>
  </div>
</div>

<script>
const replies = [
  '这是一个示例回复。',
  '你可以把这里的逻辑替换成真正的 AI API 调用。',
  '每次点击发送，我会轮流显示这几句话。',
  '这个页面放在 labs/ai-demo/ 里，是一个独立的预览站点。'
];
let i = 0;
function send() {
  const input = document.getElementById('msg');
  const text = input.value.trim();
  if (!text) return;
  const chat = document.getElementById('chat');
  chat.insertAdjacentHTML('beforeend', `<div class="message user">${text}</div>`);
  input.value = '';
  setTimeout(() => {
    chat.insertAdjacentHTML('beforeend', `<div class="message ai">${replies[i % replies.length]}</div>`);
    i++;
    chat.scrollTop = chat.scrollHeight;
  }, 600);
}
document.getElementById('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});
</script>

</body>
</html>
