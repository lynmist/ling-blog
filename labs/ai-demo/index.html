<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini 风格对话 — AI 对话示例</title>
<link rel="icon" href="../../favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --side: #f0f4f9;
  --surface: #f0f4f9;
  --surface2: #dde3ea;
  --hover: rgba(0,0,0,0.06);
  --ink: #1b1c1d;
  --ink2: #444746;
  --ink3: #6b7278;
  --line: #e2e7ec;
  --accent: #0b57d0;
  --grad: linear-gradient(90deg, #1c71d8 0%, #8b5cf6 55%, #d96570 100%);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,.10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131314;
    --side: #1e1f20;
    --surface: #1e1f20;
    --surface2: #282a2c;
    --hover: rgba(255,255,255,0.06);
    --ink: #e3e3e3;
    --ink2: #c4c7c5;
    --ink3: #8e918f;
    --line: #333537;
    --accent: #a8c7fa;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 4px 16px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Noto Sans SC', 'Inter', sans-serif;
  background: var(--bg);
  color: var(--ink);
  display: flex;
  overflow: hidden;
}
button { font-family: inherit; }

/* ── sidebar ── */
.sidebar {
  width: 260px; flex-shrink: 0;
  background: var(--side);
  display: flex; flex-direction: column;
  padding: 0.8rem 0.8rem 1rem;
  transition: margin-left .25s ease;
}
.sidebar.hidden { margin-left: -260px; }
.side-top { display: flex; align-items: center; gap: 0.4rem; padding: 0.2rem 0.2rem 0.9rem; }
.icon-btn {
  width: 40px; height: 40px; border: none; background: none; border-radius: 50%;
  color: var(--ink2); cursor: pointer; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.icon-btn:hover { background: var(--hover); }
.brand { font-size: 17px; font-weight: 500; color: var(--ink2); letter-spacing: 0.01em; }
.new-chat {
  display: flex; align-items: center; gap: 0.7rem;
  border: none; cursor: pointer;
  background: var(--surface2);
  color: var(--ink);
  font-size: 14px; font-weight: 500;
  padding: 0.75rem 1.1rem;
  border-radius: 999px;
  margin: 0.2rem 0.2rem 1.4rem;
  transition: background .15s, box-shadow .15s;
}
.new-chat:hover { background: var(--hover); box-shadow: var(--shadow-sm); }
.new-chat span:first-child { font-size: 18px; line-height: 1; }
.side-label { font-size: 12px; color: var(--ink3); padding: 0 0.9rem 0.4rem; }
.history { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.history-item {
  border: none; background: none; cursor: pointer; text-align: left;
  font-size: 13.5px; color: var(--ink2);
  padding: 0.55rem 0.9rem; border-radius: 999px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .15s;
}
.history-item:hover { background: var(--hover); }
.history-item.active { background: var(--surface2); color: var(--ink); }
.side-bottom { display: flex; flex-direction: column; gap: 2px; padding-top: 0.8rem; }
.side-bottom .history-item { display: flex; align-items: center; gap: 0.7rem; }

/* ── main ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.7rem 1.2rem;
}
.model-picker {
  display: flex; align-items: center; gap: 0.4rem;
  border: none; background: none; cursor: pointer;
  font-size: 15px; font-weight: 500; color: var(--ink2);
  padding: 0.45rem 0.8rem; border-radius: 10px;
  transition: background .15s;
}
.model-picker:hover { background: var(--hover); }
.model-picker .ver { color: var(--ink3); font-weight: 400; }
.topbar-right { display: flex; align-items: center; gap: 0.5rem; }
.back-link {
  font-size: 12.5px; color: var(--ink3); text-decoration: none;
  padding: 0.4rem 0.8rem; border-radius: 999px;
  transition: background .15s, color .15s;
}
.back-link:hover { background: var(--hover); color: var(--ink); }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--grad);
  color: #fff; font-size: 14px; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
}

.stage { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.stage-inner { width: 100%; max-width: 760px; margin: 0 auto; padding: 1rem 1.5rem 2rem; flex: 1; display: flex; flex-direction: column; }

/* greeting */
.hero { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2.2rem; padding: 2rem 0; }
.greeting { font-size: clamp(28px, 4.5vw, 40px); font-weight: 500; line-height: 1.35; }
.greeting .grad {
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.greeting .sub { display: block; color: var(--ink3); }
.suggests { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; }
.suggest {
  border: none; cursor: pointer; text-align: left;
  background: var(--surface);
  color: var(--ink2);
  border-radius: 16px;
  padding: 1rem 1rem 1.2rem;
  font-size: 13px; line-height: 1.6;
  min-height: 96px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 0.8rem;
  transition: background .15s, transform .15s;
}
.suggest:hover { background: var(--surface2); transform: translateY(-2px); }
.suggest .s-ico { font-size: 16px; color: var(--accent); }

/* chat messages */
.chat { display: none; flex-direction: column; gap: 1.6rem; padding-top: 1rem; }
.chat.on { display: flex; }
.msg-user { align-self: flex-end; max-width: 78%; }
.msg-user .bubble {
  background: var(--surface);
  border-radius: 20px 20px 6px 20px;
  padding: 0.8rem 1.1rem;
  font-size: 14.5px; line-height: 1.7;
  white-space: pre-wrap; word-break: break-word;
}
.msg-ai { display: flex; gap: 0.9rem; max-width: 92%; }
.sparkle {
  width: 30px; height: 30px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.sparkle svg { width: 22px; height: 22px; }
.msg-ai .text { font-size: 14.5px; line-height: 1.8; color: var(--ink); padding-top: 3px; white-space: pre-wrap; word-break: break-word; }
.msg-ai .text.streaming::after {
  content: '▍';
  color: var(--accent);
  animation: blink 0.9s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.sparkle.spin svg { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* input */
.input-wrap { width: 100%; max-width: 760px; margin: 0 auto; padding: 0.6rem 1.5rem 1.2rem; }
.input-box {
  display: flex; align-items: flex-end; gap: 0.3rem;
  background: var(--surface);
  border-radius: 28px;
  padding: 0.55rem 0.7rem;
  transition: box-shadow .2s, background .2s;
}
.input-box:focus-within { box-shadow: var(--shadow-md); }
.input-box textarea {
  flex: 1; border: none; outline: none; resize: none;
  background: transparent; color: var(--ink);
  font-family: inherit; font-size: 15px; line-height: 1.6;
  padding: 0.55rem 0.6rem;
  max-height: 160px;
}
.input-box textarea::placeholder { color: var(--ink3); }
.send-btn {
  width: 40px; height: 40px; border: none; border-radius: 50%;
  background: var(--accent); color: #fff;
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .15s, transform .1s;
  flex-shrink: 0;
}
.send-btn:disabled { opacity: 0.35; cursor: default; }
.send-btn:not(:disabled):active { transform: scale(0.92); }
.disclaimer { text-align: center; font-size: 11.5px; color: var(--ink3); padding-top: 0.7rem; }

/* ── motion ── */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.hero { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.greeting { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
.greeting .grad { background-size: 220% 100%; animation: rise .55s cubic-bezier(.2,.8,.2,1) both, gradShift 7s ease .6s infinite; }
@keyframes gradShift { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
.suggest { opacity: 0; animation: rise .45s cubic-bezier(.2,.8,.2,1) forwards; }
.suggest:nth-child(1) { animation-delay: .18s; }
.suggest:nth-child(2) { animation-delay: .26s; }
.suggest:nth-child(3) { animation-delay: .34s; }
.suggest:nth-child(4) { animation-delay: .42s; }
.msg-user, .msg-ai { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
.hero.leaving { animation: heroOut .22s ease both; }
@keyframes heroOut { to { opacity: 0; transform: translateY(-10px); } }

/* ── dropdown menu ── */
.menu-anchor { position: relative; }
.menu {
  position: absolute; z-index: 200; top: calc(100% + 6px); left: 0;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow-md);
  padding: 0.35rem; min-width: 200px;
  transform-origin: top left;
  animation: pop .18s cubic-bezier(.2,.8,.2,1) both;
}
.menu.bottom { top: auto; bottom: calc(100% + 6px); transform-origin: bottom left; }
@keyframes pop { from { opacity: 0; transform: scale(.95) translateY(-4px); } to { opacity: 1; transform: none; } }
.menu-item {
  display: flex; align-items: center; gap: 0.7rem; width: 100%;
  border: none; background: none; cursor: pointer; text-align: left;
  font-size: 13.5px; color: var(--ink);
  padding: 0.55rem 0.8rem; border-radius: 8px;
  transition: background .12s;
}
.menu-item:hover { background: var(--hover); }
.menu-item .check { margin-left: auto; color: var(--accent); visibility: hidden; }
.menu-item.on .check { visibility: visible; }

/* ── toast ── */
.toast {
  position: fixed; left: 50%; bottom: 108px; z-index: 300;
  transform: translateX(-50%) translateY(8px);
  background: var(--ink); color: var(--bg);
  font-size: 13px; padding: 0.55rem 1.1rem; border-radius: 999px;
  box-shadow: var(--shadow-md);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%); }

/* mic listening */
.icon-btn.listening { color: #d96570; animation: pulse 1.1s ease infinite; }
@keyframes pulse { 0%, 100% { background: var(--hover); } 50% { background: rgba(217,101,112,.22); } }

/* scrim for mobile sidebar */
.scrim {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,.35);
  opacity: 0; visibility: hidden;
  transition: opacity .25s ease, visibility .25s;
}
.scrim.show { opacity: 1; visibility: visible; }
@media (min-width: 861px) { .scrim { display: none; } }

@media (max-width: 860px) {
  .sidebar { position: fixed; z-index: 100; height: 100%; box-shadow: var(--shadow-md); }
  .suggests { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .msg-user { max-width: 92%; }
  .back-link { display: none; }
}
</style>
</head>
<body>

<aside class="sidebar hidden" id="sidebar">
  <div class="side-top">
    <span class="brand">Gemini</span>
  </div>
  <button class="new-chat" id="new-chat"><span>＋</span><span>新对话</span></button>
  <div class="side-label">最近</div>
  <div class="history" id="history">
    <button class="history-item">周末爬山路线规划</button>
    <button class="history-item">Python 爬虫报错排查</button>
    <button class="history-item">把这段话翻译成英文</button>
    <button class="history-item">AstrBot 插件开发笔记</button>
  </div>
  <div class="side-bottom">
    <a class="history-item" href="../../labs.html" style="text-decoration:none">← 返回实验页</a>
    <button class="history-item" id="settings-btn">⚙ 设置</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:0.2rem">
      <button class="icon-btn" id="menu-btn" aria-label="菜单">☰</button>
      <span class="menu-anchor">
        <button class="model-picker" id="model-btn">Gemini <span class="ver" id="model-ver">2.5 Pro</span> ▾</button>
      </span>
    </div>
    <div class="topbar-right">
      <a class="back-link" href="../../labs.html">← 返回实验页</a>
      <span class="menu-anchor">
        <button class="avatar" id="avatar-btn" style="border:none;cursor:pointer">L</button>
      </span>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="stage-inner">

      <div class="hero" id="hero">
        <div class="greeting">
          <span class="grad">你好，ling</span>
          <span class="sub">今天想聊点什么？</span>
        </div>
        <div class="suggests">
          <button class="suggest" data-q="帮我写一个 Python 快速排序"><span class="s-ico">✎</span><span>帮我写一个 Python 快速排序</span></button>
          <button class="suggest" data-q="推荐几首适合雨天听的歌"><span class="s-ico">♪</span><span>推荐几首适合雨天听的歌</span></button>
          <button class="suggest" data-q="解释一下什么是黑洞吸积盘"><span class="s-ico">✦</span><span>解释一下什么是黑洞吸积盘</span></button>
          <button class="suggest" data-q="给我的博客起个新名字"><span class="s-ico">❀</span><span>给我的博客起个新名字</span></button>
        </div>
      </div>

      <div class="chat" id="chat"></div>

    </div>
  </div>

  <div class="input-wrap">
    <div class="input-box">
      <span class="menu-anchor">
        <button class="icon-btn" id="plus-btn" aria-label="添加">＋</button>
      </span>
      <textarea id="msg" rows="1" placeholder="问问 Gemini"></textarea>
      <button class="icon-btn" id="mic-btn" aria-label="语音输入">🎙</button>
      <button class="send-btn" id="send" aria-label="发送" disabled>↑</button>
    </div>
    <p class="disclaimer">这是前端演示页面，回复为预设内容，不会真正发送请求。</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SPARKLE = '<svg viewBox="0 0 24 24"><defs><linearGradient id="ggrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1c71d8"/><stop offset="55%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#d96570"/></linearGradient></defs><path fill="url(#ggrad)" d="M12 2c.6 4.8 2.4 7.4 10 10-7.6 2.6-9.4 5.2-10 10-.6-4.8-2.4-7.4-10-10 7.6-2.6 9.4-5.2 10-10z"/></svg>';

const replies = [
  '好的，这是一个示例回答。真正的 Gemini 会在这里流式输出内容，而这个页面只是前端预览，回复来自预设列表。',
  '你可以把 script 里的 replies 换成真实的 API 调用，比如 fetch 你自己的后端，再逐字把返回内容渲染出来。',
  '流式输出的效果是用 setInterval 逐字追加实现的，配合右下角的光标闪烁，看起来就像在实时生成。',
  '侧边栏的「新对话」可以清空当前对话回到问候页，历史记录那几项只是装饰，点不动也没关系。'
];
let replyIdx = 0;

const stage = document.getElementById('stage');
const hero = document.getElementById('hero');
const chat = document.getElementById('chat');
const input = document.getElementById('msg');
const sendBtn = document.getElementById('send');

function scrollBottom() { stage.scrollTop = stage.scrollHeight; }

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  sendBtn.disabled = !input.value.trim();
}

function send(text) {
  text = (text !== undefined ? text : input.value).trim();
  if (!text) return;

  if (hero.style.display !== 'none') {
    hero.classList.add('leaving');
    setTimeout(() => { hero.style.display = 'none'; hero.classList.remove('leaving'); }, 200);
    chat.classList.add('on');
  }

  const u = document.createElement('div');
  u.className = 'msg-user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  u.appendChild(b);
  chat.appendChild(u);

  input.value = '';
  autoGrow();
  scrollBottom();

  // AI: sparkle + streaming text
  const ai = document.createElement('div');
  ai.className = 'msg-ai';
  const sp = document.createElement('div');
  sp.className = 'sparkle spin';
  sp.innerHTML = SPARKLE;
  const t = document.createElement('div');
  t.className = 'text streaming';
  ai.appendChild(sp);
  ai.appendChild(t);
  chat.appendChild(ai);
  scrollBottom();

  const full = replies[replyIdx % replies.length];
  replyIdx++;
  let n = 0;
  const timer = setInterval(() => {
    n += 1 + Math.floor(Math.random() * 2);
    t.textContent = full.slice(0, n);
    scrollBottom();
    if (n >= full.length) {
      clearInterval(timer);
      t.classList.remove('streaming');
      sp.classList.remove('spin');
    }
  }, 28);
}

input.addEventListener('input', autoGrow);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', () => send());

document.querySelectorAll('.suggest').forEach(s => {
  s.addEventListener('click', () => send(s.dataset.q));
});

document.getElementById('new-chat').addEventListener('click', () => {
  chat.innerHTML = '';
  chat.classList.remove('on');
  hero.style.display = '';
  input.value = '';
  autoGrow();
  input.focus();
  document.querySelectorAll('#history .history-item').forEach(x => x.classList.remove('active'));
});

const sidebar = document.getElementById('sidebar');
const scrim = document.createElement('div');
scrim.className = 'scrim';
document.body.appendChild(scrim);
scrim.addEventListener('click', () => { sidebar.classList.add('hidden'); syncScrim(); });
function syncScrim() {
  scrim.classList.toggle('show', window.innerWidth <= 860 && !sidebar.classList.contains('hidden'));
}
function toggleSidebar() { sidebar.classList.toggle('hidden'); syncScrim(); }
document.getElementById('menu-btn').addEventListener('click', toggleSidebar);
window.addEventListener('resize', syncScrim);
// desktop: sidebar open by default
if (window.innerWidth > 860) sidebar.classList.remove('hidden');
syncScrim();

/* ── toast ── */
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

/* ── dropdown menus ── */
let openMenuEl = null;
function closeMenu() {
  if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; }
  document.removeEventListener('click', onDocClick);
}
function onDocClick(e) { if (openMenuEl && !openMenuEl.contains(e.target)) closeMenu(); }
function openMenu(anchor, items, bottom) {
  const m = document.createElement('div');
  m.className = 'menu' + (bottom ? ' bottom' : '');
  items.forEach(it => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'menu-item' + (it.on ? ' on' : '');
    const ico = document.createElement('span');
    ico.textContent = it.icon || '';
    const lab = document.createElement('span');
    lab.textContent = it.label;
    const chk = document.createElement('span');
    chk.className = 'check';
    chk.textContent = '✓';
    b.append(ico, lab, chk);
    b.addEventListener('click', e => { e.stopPropagation(); closeMenu(); it.action && it.action(); });
    m.appendChild(b);
  });
  anchor.appendChild(m);
  openMenuEl = m;
  setTimeout(() => document.addEventListener('click', onDocClick), 0);
}
function bindMenuButton(btn, anchor, itemsFn, bottom) {
  btn.addEventListener('click', e => {
    e.stopPropagation();
    if (openMenuEl) { closeMenu(); return; }
    openMenu(anchor, itemsFn(), bottom);
  });
}

/* model picker */
const models = ['2.5 Pro', '2.5 Flash', '2.5 Flash-Lite'];
let currentModel = '2.5 Pro';
const modelVer = document.getElementById('model-ver');
bindMenuButton(
  document.getElementById('model-btn'),
  document.getElementById('model-btn').parentElement,
  () => models.map(v => ({
    label: 'Gemini ' + v,
    on: v === currentModel,
    action: () => { currentModel = v; modelVer.textContent = v; toast('已切换到 Gemini ' + v + '（演示）'); }
  }))
);

/* plus menu */
bindMenuButton(
  document.getElementById('plus-btn'),
  document.getElementById('plus-btn').parentElement,
  () => [
    { icon: '🖼', label: '上传图片', action: () => toast('演示页面，暂不支持上传图片') },
    { icon: '📄', label: '上传文件', action: () => toast('演示页面，暂不支持上传文件') },
    { icon: '☁', label: '从云端硬盘选择', action: () => toast('演示页面，暂不支持云端硬盘') }
  ],
  true
);

/* mic */
document.getElementById('mic-btn').addEventListener('click', () => {
  const on = document.getElementById('mic-btn').classList.toggle('listening');
  toast(on ? '正在聆听…（演示）' : '已停止聆听');
});

/* avatar */
bindMenuButton(
  document.getElementById('avatar-btn'),
  document.getElementById('avatar-btn').parentElement,
  () => [
    { icon: '👤', label: 'ling（演示账号）', action: () => toast('这是演示账号') },
    { icon: '↩', label: '退出登录', action: () => toast('演示页面，无需退出') }
  ]
);

/* settings */
document.getElementById('settings-btn').addEventListener('click', () => toast('演示页面，设置暂不可用'));

/* history items start a seeded conversation */
document.querySelectorAll('#history .history-item').forEach(h => {
  h.addEventListener('click', () => {
    document.querySelectorAll('#history .history-item').forEach(x => x.classList.remove('active'));
    h.classList.add('active');
    chat.innerHTML = '';
    chat.classList.remove('on');
    hero.style.display = '';
    send(h.textContent.trim());
    if (window.innerWidth <= 860) { sidebar.classList.add('hidden'); syncScrim(); }
  });
});

autoGrow();
</script>
