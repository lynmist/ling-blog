<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一蕊 · The Rose — 单朵写实花朵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070408;
  --ink: #efe6ea;
  --dim: #8d7f88;
  --faint: #554a52;
  --serif: 'Noto Serif SC', serif;
  --latin: 'Cormorant Garamond', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-weight: 300;
  height: 100vh; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(200,60,90,.35); }

#gl {
  position: fixed; inset: 0; z-index: 1;
  width: 100vw; height: 100vh; display: block;
  cursor: grab;
}
#gl.dragging { cursor: grabbing; }
#gl-fallback {
  position: fixed; inset: 0; z-index: 2; display: none;
  align-items: center; justify-content: center;
  color: var(--dim); font-size: 14px; letter-spacing: .2em;
}

/* 文案层 */
.caption {
  position: fixed; z-index: 25; pointer-events: none;
  left: 6vw; bottom: 7vh;
}
.caption .no {
  font-family: var(--latin); font-style: italic;
  font-size: 13px; letter-spacing: .34em; color: var(--faint);
}
.caption h1 {
  font-size: clamp(34px, 4.6vw, 58px); font-weight: 200;
  letter-spacing: .34em; margin: 14px 0 8px;
  background: linear-gradient(110deg, #f6cdd8, #c84a6a 55%, #7a1c34);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.caption .sci {
  font-family: var(--latin); font-style: italic;
  font-size: 15px; letter-spacing: .16em; color: #b0627a;
}
.caption p {
  margin-top: 20px; max-width: 320px;
  font-size: 12px; line-height: 2.2; letter-spacing: .14em; color: var(--dim);
}
.spec {
  position: fixed; z-index: 25; pointer-events: none;
  right: 6vw; bottom: 7vh; text-align: right;
  font-size: 11px; letter-spacing: .26em; color: var(--faint); line-height: 2.4;
}
.spec b { color: var(--dim); font-weight: 400; }

.hint {
  position: fixed; z-index: 25; pointer-events: none;
  left: 50%; bottom: 4.5vh; transform: translateX(-50%);
  font-size: 10px; letter-spacing: .5em; text-indent: .5em; color: var(--faint);
  animation: hint 3.5s ease-in-out infinite;
}
@keyframes hint { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }

@media (max-width: 720px) {
  .caption { left: 7vw; bottom: 9vh; }
  .caption p { display: none; }
  .spec { display: none; }
}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="gl-fallback">此设备不支持 WebGL,无法实时渲染这朵花。</div>

<div class="caption">
  <div class="no">SPECIMEN 08 — ROSA</div>
  <h1>一&thinsp;蕊</h1>
  <div class="sci">Rosa rugosa, raymarched in real time</div>
  <p>这朵花不存在于任何图片里:它是一组数学曲面,由你显卡里的每个像素,以光线行进的方式,一帧一帧求交、投影、透光而成。</p>
</div>

<div class="spec">
  <div><b>渲染</b> 逐像素光线行进 · SDF</div>
  <div><b>花瓣</b> 六重旋生 · 杯状曲面</div>
  <div><b>光照</b> 软阴影 · 次表面透光</div>
  <div><b>素材</b> 零 SVG · 零位图</div>
</div>

<div class="hint">拖拽 · 绕这朵花转一圈</div>

<script>
/* ═══════════ 一蕊:WebGL 光线行进单朵玫瑰 ═══════════ */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
if (!gl) {
  document.getElementById('gl-fallback').style.display = 'flex';
  throw new Error('WebGL unavailable');
}

const VERT = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FRAG = `
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform float uBloom;   // 0 → 1 绽放
uniform vec2  uRot;     // yaw, pitch

#define FAR 6.0
#define STEPS 120

mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

/* 命中材质:花瓣局部坐标 (u 沿瓣长, v 沿瓣宽), ring 序号 */
float gU, gV, gRing, gEdge;

/* ── 花朵 SDF:六重花瓣环 + 花心 ── */
float map(vec3 p){
  float d = 1e9;
  float bs = 0.35 + 0.65 * uBloom;               // 整体随绽放展开
  float r  = length(p.xz);
  float ay = atan(p.z, p.x);

  /* 花心:带螺旋纹的小球 */
  {
    vec3 bp = p - vec3(0.0, 0.16 * bs, 0.0);
    float bud = length(bp * vec3(1.0, 0.85, 1.0)) - 0.115 * bs;
    bud += 0.012 * bs * sin(ay * 14.0 + p.y * 42.0) * uBloom;
    if (bud < d){ d = bud; gU = 0.0; gV = ay; gRing = 9.0; gEdge = 0.0; }
  }

  /* 花瓣环:外 → 内 */
  for (int k = 0; k < 6; k++){
    float fk = float(k);
    float t  = fk / 5.0;                          // 0 外 → 1 内
    float count = 9.0 - fk;                       // 9..4 瓣
    float sector = 6.2831853 / count;
    float phase = fk * 2.4 + 0.6;

    float ringR = mix(0.60, 0.10, t) * bs;
    float len   = mix(0.78, 0.46, t) * bs;
    float wid   = mix(0.34, 0.20, t) * bs;
    float curl  = mix(1.9, 3.1, t);               // 内瓣更向上合抱
    float open  = mix(1.05, 0.04, t) * uBloom;    // 外瓣向外翻
    float baseY = -0.075 * (1.0 - t) * bs;

    /* 折叠进本环的扇区 */
    float a = mod(ay + phase, sector) - sector * 0.5;
    float u = r - ringR;
    float v = a * r;
    float w = p.y - baseY;

    float un = clamp(u / len, 0.0, 1.0);
    /* 中线剖面:先升后外翻;叠加细微波纹 */
    float prof = curl * u * u - open * pow(un, 2.6) * len * 0.9;
    prof += 0.014 * sin(v * 34.0 + u * 9.0 + fk) * bs;
    /* 杯状横截面:瓣缘上卷 */
    float cupK = (1.3 - t * 0.5) / max(len, 0.05);
    prof += cupK * v * v * 0.55;
    /* 半宽:基部窄、瓣端宽,边缘波皱 */
    float hw = wid * pow(un, 0.5) * (1.0 + 0.09 * sin(u * 26.0 + fk * 3.0));
    hw = min(hw, sector * r * 0.49);

    float surf = w - prof;
    float pd = abs(surf) - 0.011 * bs;
    pd = max(pd, -u);
    pd = max(pd, u - len);
    pd = max(pd, abs(v) - hw);

    if (pd < d){
      d = pd; gU = un; gV = v / max(wid, 1e-3); gRing = fk;
      gEdge = max(abs(v) / max(hw, 1e-3), un);    // 接近瓣缘程度
    }
  }
  return d * 0.85;                                 // 曲面欠估计,让步进稳定
}

vec3 calcNormal(vec3 p){
  vec2 e = vec2(0.0016, -0.0016);
  return normalize(
    e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) +
    e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}

float softShadow(vec3 ro, vec3 rd){
  float res = 1.0, t = 0.02;
  for (int i = 0; i < 26; i++){
    float h = map(ro + rd * t);
    res = min(res, 9.0 * h / t);
    t += clamp(h, 0.015, 0.14);
    if (res < 0.02 || t > 2.6) break;
  }
  return clamp(res, 0.0, 1.0);
}

vec3 palette(float ring, float u){
  /* 外深内浅的玫瑰色谱 */
  vec3 deep  = vec3(0.235, 0.020, 0.065);
  vec3 base  = vec3(0.545, 0.055, 0.175);
  vec3 light = vec3(0.965, 0.415, 0.520);
  vec3 c = mix(base, deep,  clamp(ring / 5.0, 0.0, 1.0) * 0.85);
  c = mix(c, light, u * u * 0.55);
  return c;
}

vec3 render(vec3 ro, vec3 rd, vec2 q){
  /* 背景:暗色径向渐变 + 焦外光斑 */
  vec3 bg = mix(vec3(0.030, 0.016, 0.028), vec3(0.105, 0.045, 0.075),
                exp(-dot(q, q) * 1.1));
  for (int i = 0; i < 9; i++){
    float fi = float(i);
    vec2 bp = vec2(hash(vec2(fi, 1.7)), hash(vec2(2.3, fi))) * 2.6 - 1.3;
    float bd = length(q - bp);
    float br = 0.10 + 0.22 * hash(vec2(fi, fi));
    float glow = 1.0 - smoothstep(br * 0.25, br, bd);
    bg += glow * 0.028 * mix(vec3(0.9, 0.35, 0.5), vec3(0.45, 0.4, 0.8), hash(vec2(fi, 9.1)));
  }

  /* 光线行进 */
  float t = 0.0;
  float hit = -1.0;
  for (int i = 0; i < STEPS; i++){
    vec3 p = ro + rd * t;
    float h = map(p);
    if (h < 0.0016 * max(t, 1.0)){ hit = t; break; }
    t += h;
    if (t > FAR) break;
  }

  vec3 col = bg;
  if (hit > 0.0){
    vec3 p = ro + rd * hit;
    vec3 n = calcNormal(p);
    if (n.y < -0.6) n = -n;                       // 薄瓣背面翻正

    vec3 lig = normalize(vec3(0.55, 0.75, 0.45)); // 暖色主光
    vec3 hal = normalize(lig - rd);

    vec3 albedo;
    if (gRing > 8.5){
      albedo = vec3(0.30, 0.03, 0.10);            // 花心
      albedo *= 0.8 + 0.2 * sin(gV * 14.0);
    } else {
      albedo = palette(gRing, gU);
      /* 细脉:沿瓣长的暗纹 */
      float vein = smoothstep(0.92, 1.0, abs(sin(gV * 26.0))) * 0.16;
      albedo *= 1.0 - vein;
      /* 瓣缘透光薄边 */
      albedo = mix(albedo, vec3(1.0, 0.62, 0.68), smoothstep(0.86, 1.0, gEdge) * 0.5);
    }

    float sha = softShadow(p + n * 0.01, lig);
    float dif = clamp(dot(n, lig), 0.0, 1.0);
    float amb = 0.5 + 0.5 * n.y;
    float bac = clamp(dot(n, normalize(vec3(-0.5, 0.15, -0.55))), 0.0, 1.0);
    float fre = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 4.0);
    float spe = pow(clamp(dot(n, hal), 0.0, 1.0), 42.0);
    /* 次表面透光:逆光时花瓣发亮 */
    float sss = pow(clamp(1.0 + dot(rd, lig), 0.0, 1.0), 3.0);

    col  = albedo * (0.16 + 0.34 * amb) * vec3(0.55, 0.5, 0.72);
    col += albedo * dif * sha * vec3(1.25, 1.05, 0.95) * 1.35;
    col += albedo * bac * vec3(0.5, 0.22, 0.3) * 0.5;
    col += albedo * sss * vec3(1.1, 0.45, 0.45) * 0.85;
    col += fre * vec3(0.9, 0.5, 0.6) * 0.22;
    col += spe * sha * vec3(1.0, 0.8, 0.85) * 0.35;

    /* 远处隐入背景 */
    col = mix(col, bg, smoothstep(3.2, FAR, hit));
  }

  /* 辉光感 + 暗角 + 颗粒 + 伽马 */
  col = pow(col, vec3(0.92));
  col *= 1.0 - 0.42 * dot(q * 0.72, q * 0.72);
  col += (hash(gl_FragCoord.xy + uTime) - 0.5) * 0.028;
  return pow(max(col, 0.0), vec3(0.4545));
}

void main(){
  vec2 uv = (gl_FragCoord.xy * 2.0 - uRes) / uRes.y;

  /* 轨道相机 */
  float yaw = uRot.x + uTime * 0.07;
  float pitch = clamp(uRot.y, -0.15, 1.1);
  vec3 ro = vec3(0.0, 0.55, 2.35);
  ro.yz *= rot(-pitch + 0.42);
  ro.xz *= rot(yaw);
  vec3 ta = vec3(0.0, 0.10, 0.0);

  vec3 fw = normalize(ta - ro);
  vec3 ri = normalize(cross(fw, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(ri, fw);
  vec3 rd = normalize(fw * 1.55 + ri * uv.x + up * uv.y);

  gl_FragColor = vec4(render(ro, rd, uv), 1.0);
}
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    throw new Error('shader compile failed');
  }
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(prog));
  throw new Error('program link failed');
}
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uRes = gl.getUniformLocation(prog, 'uRes');
const uTime = gl.getUniformLocation(prog, 'uTime');
const uBloom = gl.getUniformLocation(prog, 'uBloom');
const uRot = gl.getUniformLocation(prog, 'uRot');

/* 高清:按设备像素比渲染,上限 2x 保帧率 */
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
addEventListener('resize', resize);

/* 拖拽环绕 */
let yaw = 0, pitch = 0.35, dragging = false, px = 0, py = 0, idle = 0;
canvas.addEventListener('pointerdown', e => {
  dragging = true; px = e.clientX; py = e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  yaw -= (e.clientX - px) * 0.005;
  pitch = Math.min(1.1, Math.max(-0.15, pitch + (e.clientY - py) * 0.004));
  px = e.clientX; py = e.clientY; idle = 0;
});
addEventListener('pointerup', () => {
  dragging = false;
  canvas.classList.remove('dragging');
});

/* 绽放动画:加载后 5 秒 ease-out 开到满 */
const start = performance.now();
const easeOut = t => 1 - Math.pow(1 - t, 4);

let last = start;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  idle += dt;
  /* 静置时缓慢自转(叠加在 shader 的慢转之上) */
  if (!dragging && idle > 2.5) yaw += dt * 0.05;

  const bloomT = Math.min((now - start) / 5000, 1);
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform1f(uTime, now / 1000);
  gl.uniform1f(uBloom, easeOut(bloomT));
  gl.uniform2f(uRot, yaw, pitch);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
