<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 — ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F7F9FC; --blue: #5B9EC9; --blue-l: #B8D9EF;
  --blue-ll: #E4F3FB; --blue-d: #2A6FA0; --line: #DDE8F0;
  --ink: #1C2B38; --ink2: #4A6070; --ink3: #8AAABB; --ink4: #C0D4DF;
}
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: 'Noto Sans SC','Inter',sans-serif; -webkit-font-smoothing: antialiased; }
body::before { content:''; position:fixed; top:-200px; right:-150px; width:600px; height:600px; background:radial-gradient(ellipse,rgba(155,210,240,0.18) 0%,transparent 65%); pointer-events:none; z-index:0; }
nav { position:sticky; top:0; z-index:100; background:rgba(247,249,252,0.9); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
.nav-inner { max-width:680px; margin:0 auto; padding:0 2rem; height:54px; display:flex; align-items:center; justify-content:space-between; }
.nav-logo { display:flex; align-items:center; gap:9px; text-decoration:none; }
.nav-dot { width:7px; height:7px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--blue-l)); }
.nav-name { font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink); }
.nav-back { font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink3); text-decoration:none; padding:6px 12px; border-radius:99px; transition:color .15s,background .15s; }
.nav-back:hover { color:var(--ink); background:var(--blue-ll); }
.page { max-width:680px; margin:0 auto; padding:0 2rem 8rem; position:relative; z-index:1; }
.page-header { padding-top:6rem; padding-bottom:4rem; border-bottom:1px solid var(--line); }
.page-eyebrow { font-size:10px; letter-spacing:0.28em; text-transform:uppercase; color:var(--blue); display:flex; align-items:center; gap:10px; margin-bottom:2rem; }
.page-eyebrow::before { content:''; width:14px; height:1px; background:var(--blue); display:block; }
.page-title { font-family:'Noto Serif SC',serif; font-size:clamp(1.8rem,5vw,2.6rem); font-weight:300; color:var(--ink); line-height:1.3; margin-bottom:1rem; }
.page-sub { font-size:13px; color:var(--ink3); line-height:1.8; }
.writing-list { display:flex; flex-direction:column; padding-top:3rem; }
.writing-item { display:flex; align-items:baseline; justify-content:space-between; gap:2rem; padding:1.4rem 0; border-bottom:1px solid var(--line); text-decoration:none; color:inherit; transition:padding-left .18s; }
.writing-item:first-child { border-top:1px solid var(--line); }
.writing-item:hover { padding-left:8px; }
.writing-item:hover .wi-title { color:var(--ink); }
.wi-left { display:flex; align-items:baseline; gap:1rem; min-width:0; }
.wi-tag { font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:var(--blue); white-space:nowrap; flex-shrink:0; }
.wi-title { font-size:15px; color:var(--ink2); line-height:1.4; transition:color .15s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wi-date { font-size:11px; color:var(--ink4); white-space:nowrap; flex-shrink:0; font-family:'Inter',sans-serif; }
.empty { padding:4rem 0; text-align:center; }
.empty p { font-size:13px; color:var(--ink4); letter-spacing:0.06em; }
footer { margin-top:6rem; padding-top:2rem; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
footer p { font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink4); }
@media(max-width:600px){ .nav-inner,.page{padding-left:1.4rem;padding-right:1.4rem;} }
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><span class="nav-dot"></span><span class="nav-name">ling</span></a>
    <a href="index.html" class="nav-back">← Back</a>
  </div>
</nav>
<div class="page">
  <header class="page-header">
    <p class="page-eyebrow">Archive</p>
    <h1 class="page-title">全部文章</h1>
    <p class="page-sub">记录一些看见的、感受到的、想留下来的事情。</p>
  </header>
  <div class="writing-list" id="writing-list">
    <div class="empty"><p>加载中…</p></div>
  </div>
  <footer>
    <p>© 2026 ling</p>
    <p>Writing · Archive</p>
  </footer>
</div>
<script>
fetch('posts/index.json')
  .then(r => r.json())
  .then(posts => {
    const list = document.getElementById('writing-list');
    if (!posts || posts.length === 0) {
      list.innerHTML = '<div class="empty"><p>还没有文章</p></div>';
      return;
    }
    list.innerHTML = posts.map(p => `
      <a href="posts/${p.slug}.html" class="writing-item">
        <div class="wi-left">
          <span class="wi-tag">${p.tag || '随笔'}</span>
          <span class="wi-title">${p.title}</span>
        </div>
        <span class="wi-date">${p.date || ''}</span>
      </a>
    `).join('');
  })
  .catch(() => {
    document.getElementById('writing-list').innerHTML = '<div class="empty"><p>暂无文章</p></div>';
  });
</script>
</body>
</html>
