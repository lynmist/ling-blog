   <div class="site-section" style="padding-top: 3rem;">
    <h2 class="about-name">关于本站</h2>
    <p>这是一个缓慢更新中的个人网站，用来存放照片、文字和一些无处安放的想法。</p>
    <p>没有复杂的分类，也没有刻意的运营。它只是我生活中某些片段的存档，像一本打开的笔记本，偶尔有人翻到会很好。</p>
    <p>站点采用纯静态方式构建，托管在 GitHub Pages，通过 Cloudflare 分发。设计尽量保持简洁、安静，让内容自己说话。</p>
    <p>如果你也做类似的个人站点，欢迎来<a href="link.html">友链</a>串门。</p>
