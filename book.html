<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<script src="js/theme.js"></script>
<title>书 — 书架 — ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="css/base.css" rel="stylesheet">
<style>
:root { --bc1: hsl(215 62% 72%); --bc2: hsl(249 55% 50%); }

/* ── ambient glow tinted by the book's cover hue ── */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i {
  position: absolute; border-radius: 50%;
  filter: blur(90px); opacity: .4;
  animation: drift 20s ease-in-out infinite alternate;
}
.aurora i:nth-child(1) {
  width: 42vw; height: 42vw; left: -10vw; top: -12vw;
  background: radial-gradient(circle, color-mix(in srgb, var(--bc1) 45%, transparent), transparent 70%);
}
.aurora i:nth-child(2) {
  width: 34vw; height: 34vw; right: -8vw; top: 22vh;
  background: radial-gradient(circle, color-mix(in srgb, var(--bc2) 32%, transparent), transparent 70%);
  animation-delay: -8s;
}
html[data-theme="dark"] .aurora i { opacity: .16; }
@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(4vw, 3vh) scale(1.1); }
}

.book-hero {
  position: relative;
  padding-top: 4.5rem;
  display: flex; gap: 2.4rem; align-items: flex-end;
  margin-bottom: 2.8rem;
}

/* giant vertical outline of the book's name behind the hero */
.watermark {
  position: absolute; right: -1rem; top: -2.5rem; z-index: -1;
  writing-mode: vertical-rl;
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(5rem, 14vw, 8.5rem);
  letter-spacing: .1em; line-height: 1;
  color: transparent;
  -webkit-text-stroke: 1px var(--blue-l);
  opacity: .35;
  pointer-events: none; user-select: none;
  white-space: nowrap;
}
html[data-theme="dark"] .watermark { opacity: .22; }

.cover-stage { flex-shrink: 0; transition: transform .25s ease-out; }
.detail-cover {
  position: relative;
  width: 148px; aspect-ratio: 3/4.1; flex-shrink: 0;
  border-radius: 4px 10px 10px 4px;
  background: linear-gradient(155deg, var(--c1, #7aa2ff), var(--c2, #5470c8));
  box-shadow: 0 18px 36px -12px rgba(40, 60, 110, .45);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  opacity: 0;
  transform: perspective(900px) rotateY(-28deg) translateY(12px);
  animation: cover-in .8s cubic-bezier(.2,.8,.2,1) .15s forwards;
}
@keyframes cover-in { to { opacity: 1; transform: none; } }
.detail-cover::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 9px; z-index: 1;
  background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.14) 55%, rgba(0,0,0,.12));
}
.detail-cover::after {
  content: ''; position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(115deg, rgba(255,255,255,.22), transparent 42%);
}
.detail-cover span {
  writing-mode: vertical-rl;
  font-family: 'Noto Serif SC', serif;
  font-size: 19px; letter-spacing: .18em;
  color: rgba(255,255,255,.95);
  text-shadow: 0 1px 6px rgba(0,0,0,.3);
  max-height: 78%; overflow: hidden;
}
.detail-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.detail-info { min-width: 0; padding-bottom: .3rem; }
.detail-chips { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .9rem; }
.book-type {
  font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--blue); background: var(--blue-ll);
  border: 1px solid var(--blue-l); border-radius: 99px;
  padding: 1px 8px;
}
.detail-eyebrow {
  font-size: 10px; letter-spacing: .28em; text-transform: uppercase;
  color: var(--ink4); font-family: 'Inter', sans-serif;
  margin-bottom: 1.1rem;
}
.detail-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 2.1rem; font-weight: 400; color: var(--ink);
  line-height: 1.35; margin-bottom: .55rem;
  background: linear-gradient(115deg, var(--ink) 30%, var(--blue) 105%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.detail-author { font-size: 13px; color: var(--ink3); margin-bottom: .8rem; }
.detail-rating { font-size: 13px; letter-spacing: .12em; color: var(--blue); }
.detail-rating .num { font-size: 11px; color: var(--ink4); margin-left: .5rem; letter-spacing: .03em; }
.detail-h {
  font-size: 11px; letter-spacing: .2em; color: var(--ink4);
  font-weight: 400; margin-bottom: .9rem;
  display: flex; align-items: center; gap: .8rem;
}
.page { counter-reset: sec; }
.detail-h::before {
  counter-increment: sec;
  content: '0' counter(sec);
  font-family: 'Inter', sans-serif;
  font-size: 10px; letter-spacing: .08em;
  color: var(--blue-l);
}
.detail-h::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.detail-desc { font-size: 13.5px; color: var(--ink2); line-height: 2.1; margin-bottom: 2.2rem; }
.detail-review { font-family: 'Noto Serif SC', serif; font-size: 14px; color: var(--ink2); line-height: 2.2; }
.detail-sec { margin-bottom: 2.2rem; }

/* ── quotes ── */
.quote-list { display: flex; flex-direction: column; gap: 1rem; }
.quote {
  position: relative;
  margin: 0; padding: 1.05rem 1.4rem 1.05rem 2.7rem;
  background: var(--blue-ll);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-family: 'Noto Serif SC', serif;
  font-size: 14px; color: var(--ink2); line-height: 2;
  transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, box-shadow .25s;
}
.quote:hover { transform: translateX(6px); border-color: var(--blue-l); box-shadow: var(--shadow-sm); }
.quote::before {
  content: '「';
  position: absolute; left: 1.05rem; top: .95rem;
  color: var(--blue); font-size: 17px;
}

/* ── markdown notes ── */
.md-body { font-size: 13.5px; color: var(--ink2); line-height: 2; }
.md-body h2, .md-body h3, .md-body h4 {
  font-family: 'Noto Serif SC', serif; font-weight: 400; color: var(--ink);
  margin: 2.2rem 0 .9rem; line-height: 1.5;
}
.md-body h2 { font-size: 1.15rem; }
.md-body h3 { font-size: 1.05rem; }
.md-body h4 { font-size: .95rem; }
.md-body > *:first-child { margin-top: 0; }
.md-body p { margin-bottom: 1rem; }
.md-body ul, .md-body ol { padding-left: 1.4rem; margin-bottom: 1rem; }
.md-body li { margin-bottom: .4rem; }
.md-body blockquote {
  margin: 0 0 1rem; padding: .15rem 1rem;
  border-left: 2px solid var(--blue-l);
  color: var(--ink3);
}
.md-body code {
  font-family: Consolas, monospace; font-size: .9em;
  background: var(--blue-ll); padding: .1em .45em; border-radius: 4px;
}
.md-body pre {
  background: var(--blue-ll); border: 1px solid var(--line); border-radius: 10px;
  padding: 1rem; overflow-x: auto; margin-bottom: 1rem;
}
.md-body pre code { background: none; padding: 0; }
.md-body pre.mermaid {
  background: transparent; border: none; padding: 1rem 0;
  display: flex; justify-content: center;
}
.md-body hr { border: none; border-top: 1px solid var(--line); margin: 2rem 0; }
.md-body a { color: var(--blue); text-decoration: none; }
.md-body img { max-width: 100%; border-radius: 10px; }

.not-found { padding: 6rem 0; text-align: center; }
.not-found p { font-size: 13px; color: var(--ink4); margin-bottom: 1.5rem; }
.not-found a { font-size: 12px; color: var(--blue); text-decoration: none; }
footer { margin-top: 6rem; }
@media (max-width: 600px) {
  .book-hero { gap: 1.4rem; padding-top: 3rem; }
  .watermark { right: 0; top: -1.5rem; }
  .detail-cover { width: 108px; }
  .detail-cover span { font-size: 15px; }
  .detail-name { font-size: 1.45rem; }
}
@media (prefers-reduced-motion: reduce) {
  .aurora i { animation: none; }
}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i></div>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><span class="nav-dot"></span><span class="nav-name">ling</span></a>
    <a href="bookshelf.html" class="nav-back">← 书架</a>
    <button class="theme-switch" type="button" onclick="toggleTheme()" aria-label="切换主题">
      <span class="switch-track">
        <span class="switch-thumb">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
      </span>
    </button>
  </div>
</nav>

<div class="page" id="page"></div>

<script>
const page = document.getElementById('page');
const FOOTER = `
  <footer>
    <p>© 2026 ling</p>
    <p>Reading · Archive</p>
    <p class="busuanzi-count"><span id="busuanzi_container_site_pv" style="display:none">访问 <span id="busuanzi_value_site_pv"></span> 次</span><span id="busuanzi_container_site_uv" style="display:none"> · 访客 <span id="busuanzi_value_site_uv"></span> 人</span></p>
  </footer>`;
function hueFrom(str) {
  let h = 0;
  for (const c of String(str)) h = (h * 31 + c.codePointAt(0)) % 360;
  return h;
}
function render(b) {
  document.title = `${b.name} — 书架 — ling`;
  const hue = hueFrom(b.name || '书');
  const c1 = `hsl(${hue} 62% 72%)`, c2 = `hsl(${(hue + 34) % 360} 55% 50%)`;
  document.documentElement.style.setProperty('--bc1', c1);
  document.documentElement.style.setProperty('--bc2', c2);
  const cover = b.cover
    ? `<img src="${b.cover}" alt="${b.name}">`
    : `<span>${b.name || ''}</span>`;
  const full = b.rating != null ? Math.max(0, Math.min(5, Math.round(b.rating))) : 0;
  page.innerHTML = `
    <div class="book-hero">
      <div class="watermark" aria-hidden="true">${esc(b.name || '')}</div>
      <div class="cover-stage" id="cover-stage">
        <div class="detail-cover" style="--c1:${c1};--c2:${c2}">${cover}</div>
      </div>
      <div class="detail-info">
        <p class="detail-eyebrow">Bookshelf · 藏书</p>
        <div class="detail-chips">
          <span class="book-type">${b.type || '其他'}</span>
        </div>
        <h1 class="detail-name">${b.name || '未命名'}</h1>
        <p class="detail-author">${b.author || ''}</p>
        ${b.rating != null ? `<div class="detail-rating">${'★'.repeat(full)}${'☆'.repeat(5 - full)}<span class="num">${b.rating} / 5</span></div>` : ''}
      </div>
    </div>
    <div class="detail-sec">
      <h2 class="detail-h">简介</h2>
      <p class="detail-desc">${b.desc || ''}</p>
    </div>
    ${b.review ? `
    <div class="detail-sec">
      <h2 class="detail-h">读后</h2>
      <p class="detail-review">${b.review}</p>
    </div>` : ''}
    ${b.quotes && b.quotes.length ? `
    <div class="detail-sec">
      <h2 class="detail-h">书摘</h2>
      <div class="quote-list">
        ${b.quotes.map(q => `<blockquote class="quote"><p>${esc(q)}</p></blockquote>`).join('')}
      </div>
    </div>` : ''}
    ${b.notes ? `
    <div class="detail-sec">
      <h2 class="detail-h">笔记</h2>
      <div class="md-body" id="md-body"><p style="color:var(--ink4);font-size:12px">笔记加载中…</p></div>
    </div>` : ''}
    ${FOOTER}
  `;
  mountNotes(b);
  mountTilt();
}
function mountTilt() {
  const stage = document.getElementById('cover-stage');
  if (!stage) return;
  if (!window.matchMedia('(pointer: fine)').matches) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  stage.addEventListener('mousemove', e => {
    const r = stage.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5;
    const y = (e.clientY - r.top) / r.height - 0.5;
    stage.style.transform = `perspective(900px) rotateY(${(x * 14).toFixed(2)}deg) rotateX(${(-y * 10).toFixed(2)}deg)`;
  });
  stage.addEventListener('mouseleave', () => { stage.style.transform = ''; });
}
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function mountNotes(b) {
  if (!b.notes) return;
  loadScript('https://cdn.jsdelivr.net/npm/marked@12/marked.min.js').then(() => {
    const renderer = new marked.Renderer();
    renderer.code = function (code, lang) {
      if (code && typeof code === 'object') { lang = code.lang; code = code.text; }
      if (lang === 'mermaid') return `<pre class="mermaid">${esc(code)}</pre>`;
      return `<pre><code>${esc(code)}</code></pre>`;
    };
    document.getElementById('md-body').innerHTML = marked.parse(b.notes, { renderer });
    const diagrams = document.querySelectorAll('.mermaid');
    if (!diagrams.length) return;
    loadScript('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js').then(() => {
      mermaid.initialize({
        startOnLoad: false,
        theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'neutral'
      });
      mermaid.run({ nodes: diagrams });
    });
  }).catch(() => {
    const el = document.getElementById('md-body');
    if (el) el.innerHTML = '<p style="color:var(--ink4);font-size:12px">笔记加载失败</p>';
  });
}
function renderMissing() {
  document.title = '没有找到这本书 — ling';
  page.innerHTML = `
    <div class="not-found">
      <p>没有找到这本书，它可能还没被放上书架。</p>
      <a href="bookshelf.html">← 回到书架</a>
    </div>
    ${FOOTER}
  `;
}
const id = new URLSearchParams(location.search).get('id');
Promise.all([
  fetch('books/index.json').then(r => r.json()),
  id ? fetch(`books/${encodeURIComponent(id)}.json`).then(r => r.ok ? r.json() : null).catch(() => null) : Promise.resolve(null)
])
  .then(([books, detail]) => {
    const base = (books || []).find(x => x.id === id) || (!id && books && books[0]);
    const b = base ? Object.assign({}, base, detail) : detail;
    if (b) render(b); else renderMissing();
  })
  .catch(renderMissing);
</script>

<script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
