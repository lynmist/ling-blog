<head>

<title>更多 — ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link href="css/base.css" rel="stylesheet">
<style>
.more-intro { padding-top: 3rem; font-size: 14px; color: var(--ink2); line-height: 2; max-width: 520px; }
.more-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; padding-top: 3rem; }
.more-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 0.6rem;
  padding: 1.6rem 1.4rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  text-decoration: none; color: inherit;
  box-shadow: var(--shadow-sm);
  transition: transform .2s, box-shadow .2s, border-color .2s, background .25s;
}
.more-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--blue-l); }
.more-icon {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--blue-ll);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  color: var(--blue);
  font-size: 18px;
}
.more-name { font-size: 15px; font-weight: 500; color: var(--ink); }
.more-desc { font-size: 12px; color: var(--ink2); line-height: 1.6; }
footer { margin-top: 6rem; }
@media (max-width: 600px) {
  .more-grid { grid-template-columns: 1fr; }
  .more-card { flex-direction: row; align-items: center; gap: 1rem; padding: 1.2rem; }
  .more-text { flex: 1; min-width: 0; }
}
</style>
</head>

    </ul>
    <button class="theme-switch" type="button" onclick="toggleTheme()" aria-label="切换主题">
      <span class="switch-track">
        <span class="switch-thumb">
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/></svg>
          <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
      </span>
    </button>

</nav>
