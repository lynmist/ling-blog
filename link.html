<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友链 — ling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=Noto+Sans+SC:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F7F9FC; --blue: #5B9EC9; --blue-l: #B8D9EF;
  --blue-ll: #E4F3FB; --blue-d: #2A6FA0; --line: #DDE8F0;
  --ink: #1C2B38; --ink2: #4A6070; --ink3: #8AAABB; --ink4: #C0D4DF;
}
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: 'Noto Sans SC','Inter',sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.7; }
body::before { content:''; position:fixed; top:-200px; right:-150px; width:600px; height:600px; background:radial-gradient(ellipse,rgba(155,210,240,0.18) 0%,transparent 65%); pointer-events:none; z-index:0; }
nav { position:sticky; top:0; z-index:100; background:rgba(247,249,252,0.9); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
.nav-inner { max-width:680px; margin:0 auto; padding:0 2rem; height:54px; display:flex; align-items:center; justify-content:space-between; }
.nav-logo { display:flex; align-items:center; gap:9px; text-decoration:none; }
.nav-dot { width:7px; height:7px; border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--blue-l)); }
.nav-name { font-size:13px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:var(--ink); }
.nav-links { display:flex; gap:0; list-style:none; }
.nav-links a { font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink3); text-decoration:none; padding:6px 12px; border-radius:99px; transition:color .15s,background .15s; }
.nav-links a:hover { color:var(--ink); background:var(--blue-ll); }
.page { max-width:680px; margin:0 auto; padding:0 2rem 8rem; position:relative; z-index:1; }
.page-header { padding-top:6rem; padding-bottom:4rem; border-bottom:1px solid var(--line); }
.page-eyebrow { font-size:10px; letter-spacing:0.28em; text-transform:uppercase; color:var(--blue); display:flex; align-items:center; gap:10px; margin-bottom:2rem; }
.page-eyebrow::before { content:''; width:14px; height:1px; background:var(--blue); display:block; }
.page-title { font-family:'Noto Serif SC',serif; font-size:clamp(1.8rem,5vw,2.6rem); font-weight:300; color:var(--ink); line-height:1.3; margin-bottom:1rem; }
.page-sub { font-size:13px; color:var(--ink3); line-height:1.8; }
.link-intro { padding-top:3rem; font-size:14px; color:var(--ink2); line-height:2; max-width:520px; }
.link-list { display:grid; grid-template-columns:1fr; gap:1rem; padding-top:3rem; }
.link-card {
  display:flex; align-items:flex-start; gap:1.2rem;
  padding:1.4rem 1.6rem;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  text-decoration:none; color:inherit;
  transition:transform .18s, box-shadow .18s, border-color .18s;
}
.link-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(91,158,201,0.08); border-color:var(--blue-l); }
.link-avatar {
  width:44px; height:44px; border-radius:50%;
  background:var(--blue-ll);
  border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
  font-family:'Noto Serif SC',serif; font-size:18px; color:var(--blue);
}
.link-avatar img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
.link-main { min-width:0; flex:1; }
.link-name { font-size:15px; font-weight:500; color:var(--ink); margin-bottom:0.35rem; }
.link-desc { font-size:13px; color:var(--ink2); line-height:1.7; margin-bottom:0.5rem; }
.link-url { font-size:11px; color:var(--blue); font-family:'Inter',sans-serif; letter-spacing:0.02em; word-break:break-all; }
.link-arrow { font-size:18px; color:var(--ink4); align-self:center; flex-shrink:0; transition:color .15s; }
.link-card:hover .link-arrow { color:var(--blue); }
.empty { padding:4rem 0; text-align:center; }
.empty p { font-size:13px; color:var(--ink4); letter-spacing:0.06em; }
footer { margin-top:6rem; padding-top:2rem; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
footer p { font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink4); }
@media(max-width:600px){ .nav-inner,.page{padding-left:1.4rem;padding-right:1.4rem;} .link-card{padding:1.2rem;} }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><span class="nav-dot"></span><span class="nav-name">ling</span></a>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="writing.html">Writing</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="link.html">Link</a></li>
    </ul>
  </div>
</nav>

<div class="page">
  <header class="page-header">
    <p class="page-eyebrow">Friends</p>
    <h1 class="page-title">友链</h1>
    <p class="page-sub">一些喜欢的角落，和正在发光的人。</p>
  </header>

  <p class="link-intro">这里收集了我常去的、喜欢的个人网站与博客。排名不分先后，欢迎在安静的角落里互相串门。</p>

  <div class="link-list" id="link-list">
    <div class="empty"><p>加载中…</p></div>
  </div>

  <footer>
    <p>© 2026 ling</p>
    <p>Links · Archive</p>
  </footer>
</div>

<script>
fetch('links/index.json')
  .then(r => r.json())
  .then(links => {
    const list = document.getElementById('link-list');
    if (!links || links.length === 0) {
      list.innerHTML = '<div class="empty"><p>还没有友链</p></div>';
      return;
    }
    list.innerHTML = links.map(l => {
      const host = l.url ? new URL(l.url).hostname.replace(/^www\./, '') : '';
      const initial = (l.name || '友').charAt(0);
      const avatar = l.avatar
        ? `<img src="${l.avatar}" alt="${l.name}">`
        : `<span>${initial}</span>`;
      return `
        <a href="${l.url || '#'}" class="link-card" target="_blank" rel="noopener">
          <div class="link-avatar">${avatar}</div>
          <div class="link-main">
            <div class="link-name">${l.name || '未命名'}</div>
            <div class="link-desc">${l.desc || ''}</div>
            <div class="link-url">${host}</div>
          </div>
          <div class="link-arrow">→</div>
        </a>
      `;
    }).join('');
  })
  .catch(() => {
    document.getElementById('link-list').innerHTML = '<div class="empty"><p>暂时无法加载友链</p></div>';
  });
</script>

</body>
</html>
